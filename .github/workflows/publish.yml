# Publishes the shared UI package to GitHub Packages when a version tag is pushed.
# Written against the github-actions-hardening skill: deny-all default permissions,
# least privilege per job, SHA-pinned actions, no secrets or untrusted input in scripts.
name: Publish shared UI

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the Node version pinned in mise.toml so CI runs the same tasks as a developer.
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const { version } = require("./packages/ui/package.json");
            if (process.env.TAG !== `v${version}`) {
              console.error(`Tag ${process.env.TAG} does not match packages/ui version ${version}`);
              process.exit(1);
            }'

      - name: Type-check
        run: mise run project:typecheck

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$HOME/.npmrc"
          npm publish --workspace @joeblew999/remy-ui --ignore-scripts
