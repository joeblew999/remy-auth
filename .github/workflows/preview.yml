# A preview of every pull request on Cloudflare: its own Worker, remy-auth-staging-check-pr-<number>, built
# from the pull request with staging's databases and settings, checked at level 1, and named in a comment
# on the pull request. Each push replaces it; closing or merging the pull request deletes it. Both steps are
# the package's own commands (remy cloudflare preview, preview-delete), which a developer runs the same way.
#
# It needs two repository secrets, CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (the same items fnox
# reads locally). Without them the job says so and passes, so pull requests stay mergeable meanwhile.
# Dependabot's and forks' pull requests get no secrets, so they get no preview.
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions: {}

# One preview per pull request at a time: a new push cancels the run still deploying the old one.
concurrency:
  group: preview-${{ github.repository }}-${{ github.event.number }}
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_ENV: staging

jobs:
  deploy:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: write # the comment naming the preview
    steps:
      - if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: 'echo "::notice::No preview yet. Add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID."'
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: npm
      # As in the checks: the font checks need a Han font, which a runner lacks.
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        id: preview
        run: npm run preview:pr -- pr-${{ github.event.number }} --keep
      - if: steps.preview.outputs.origin != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: "Preview of ${{ github.event.pull_request.head.sha }}, checked at level 1: ${{ steps.preview.outputs.origin }} (staging's data; deleted when this pull request closes)."
        run: gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} --edit-last --create-if-none --body "$BODY"

  delete:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm ci --ignore-scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npm run preview:pr-delete -- pr-${{ github.event.number }}
