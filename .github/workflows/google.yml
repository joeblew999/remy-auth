# The heavy checks, on GitHub after every push to main, on every pull request and on every version tag, in parallel, while
# the developer keeps coding; then the release for tags. Locally the check is npm run dev:change (seconds);
# each of these can still be run on purpose by a person (REMY_FLOW=hand npm run test -- every|google|consumers).
# Every Remy repo runs this same workflow (.plans/thin-apps.md, group 6): remy-auth through the triggers
# below, any other repo by calling it at the tag its package is on, which `remy upgrade` moves with it:
#
#   on: { push: { branches: [main], tags: ['v*'] }, workflow_dispatch: {} }
#   permissions: {}
#   jobs:
#     checks:
#       uses: joeblew999/remy-auth/.github/workflows/google.yml@vX.Y.Z
#       permissions: { contents: write, packages: write }
#
# Every step is a package.json script, so the caller's own package.json decides what runs. The release
# job runs only for a tag and publishes only what is new (remy packages publish), so a release already
# made locally with npm run dev:release is left alone; a repository that publishes no packages never
# tags. npm ci reads @joeblew999/remy-ui from GitHub Packages with the run's token (the app's .npmrc),
# once the package grants the repository read access ("Manage Actions access").
name: Checks and release

on:
  push:
    branches: [main]
    tags: ['v*']
  # A pull request too, so Dependabot's (the pinned actions, .github/dependabot.yml) arrives checked.
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions: {}

# The release's tag step pushes main and then the tag for the same commit: the tag's run (which releases)
# cancels main's run instead of running everything twice. Runs of different commits never collide.
concurrency:
  group: checks-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  # Three jobs, not one: each takes a few minutes and they share nothing, so the answer comes back in
  # the time of the longest. Each is one level of `npm run test`, the same a person can run by hand.
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: every language
            level: every
          - name: google
            level: google
          - name: consumers
            level: consumers
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # the comment on a red commit below; nothing else writes
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: npm
      # Han languages are drawn by the system's fonts on purpose (fonts.css); a runner has none, so the
      # font checks see Liberation Sans for Japanese and Chinese alike. One package, as a visitor's machine has.
      - run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run check -- types
      - run: npm run check -- unit
      - run: npm run test -- ${{ matrix.level }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-${{ strategy.job-index }}
          path: playwright-report/local
          retention-days: 14
          if-no-files-found: ignore
      # A red job reaches the person who pushed without anybody polling: a comment on the commit,
      # which GitHub sends to its author, naming this job and its level. dev:promote refuses a commit
      # whose run is not green; dev:status and dev:land say main is red.
      - if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: "The checks failed on this commit, job \"${{ matrix.name }}\" (npm run test -- ${{ matrix.level }}): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Locally, a person reproduces it with REMY_FLOW=hand npm run test -- ${{ matrix.level }}; an agent reads the run's log and runs the one area (npm run test -- only <words>)."
        run: gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$BODY" > /dev/null

  # (A red job writes on the commit itself, in its own last step above, naming itself.)

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The tag is the release package's version, the notes are CHANGELOG.md's, each package is published
      # unless its version already is, and the GitHub release is created unless it exists.
      - name: Publish and release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: npm run packages -- publish --release "$TAG"
