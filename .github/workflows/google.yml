# Level 2 checks (Google's Lighthouse audits) on every push to main and every version tag, then the
# release for tags. Every Remy repo runs this same workflow (.plans/thin-apps.md, group 6): remy-auth
# through the triggers below, any other repo by calling it at the tag its tasks and package are on,
# which project:upgrade-ui moves with them:
#
#   on: { push: { branches: [main], tags: ['v*'] }, workflow_dispatch: {} }
#   permissions: {}
#   jobs:
#     google:
#       uses: joeblew999/remy-auth/.github/workflows/google.yml@vX.Y.Z
#       permissions: { contents: write, packages: write }
#
# Every step is a shared mise task, so the caller's own mise.toml decides what runs. The release job runs
# only for a tag and publishes only what is new (packages:publish), so a release already made locally
# with packages:release (remy-auth: ui:release) is left alone; a repository that publishes no packages
# never tags. npm ci reads @joeblew999/remy-ui from GitHub Packages with the run's token (the app's
# .npmrc), once the package grants the repository read access ("Manage Actions access").
name: Google checks and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  workflow_call:

permissions: {}

# packages:tag pushes main and then the tag for the same commit: the tag's run (which releases)
# cancels main's run instead of running level 2 twice. Runs of different commits never collide.
concurrency:
  group: google-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  google:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.12 # mise.toml's min_version
          cache: true
      - run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run project:typecheck
      - run: mise run project:test:google
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: google-report
          path: playwright-report/local
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: google
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.12 # mise.toml's min_version
          cache: true
      - run: npm ci --ignore-scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The tag is RELEASE_PACKAGE's version, the notes are CHANGELOG.md's, each package is published
      # unless its version already is, and the GitHub release is created unless it exists.
      - name: Publish and release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: mise run packages:publish -- --release "$TAG"
