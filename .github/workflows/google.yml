# The heavy checks, on GitHub after every push to main, on every pull request and on every version tag, in parallel, while
# the developer keeps coding; then the release for tags. Locally the check is project:check (seconds);
# each of these can still be run on purpose (mise run project:test, project:test:google,
# project:test:consumers). Every Remy repo runs this same workflow (.plans/thin-apps.md, group 6):
# remy-auth through the triggers below, any other repo by calling it at the tag its tasks and package
# are on, which project:upgrade-ui moves with them:
#
#   on: { push: { branches: [main], tags: ['v*'] }, workflow_dispatch: {} }
#   permissions: {}
#   jobs:
#     checks:
#       uses: joeblew999/remy-auth/.github/workflows/google.yml@vX.Y.Z
#       permissions: { contents: write, packages: write }
#
# Every step is a shared mise task, so the caller's own mise.toml decides what runs. The release job runs
# only for a tag and publishes only what is new (packages:publish), so a release already made locally
# with packages:release (remy-auth: ui:release) is left alone; a repository that publishes no packages
# never tags. npm ci reads @joeblew999/remy-ui from GitHub Packages with the run's token (the app's
# .npmrc), once the package grants the repository read access ("Manage Actions access").
name: Checks and release

on:
  push:
    branches: [main]
    tags: ['v*']
  # A pull request too, so Dependabot's (the pinned actions, .github/dependabot.yml) arrives checked.
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions: {}

# packages:tag pushes main and then the tag for the same commit: the tag's run (which releases)
# cancels main's run instead of running everything twice. Runs of different commits never collide.
concurrency:
  group: checks-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  # Three jobs, not one: each takes a few minutes and they share nothing, so the answer comes back in
  # the time of the longest. Each is one mise task, the same one a developer can run by hand.
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: every language
            task: project:test
          - name: google
            task: project:test:google
          - name: consumers
            task: project:test:consumers
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.12 # mise.toml's min_version
          cache: true
      # Han languages are drawn by the system's fonts on purpose (fonts.css); a runner has none, so the
      # font checks see Liberation Sans for Japanese and Chinese alike. One package, as a visitor's machine has.
      - run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run project:typecheck
      - run: mise run project:test:unit
      - run: mise run ${{ matrix.task }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-${{ strategy.job-index }}
          path: playwright-report/local
          retention-days: 14
          if-no-files-found: ignore

  # A red run reaches the person who pushed without anybody polling: a comment on the commit, which
  # GitHub sends to its author, naming the run. dev:promote refuses a commit whose run is not green.
  report:
    if: failure()
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: "The checks failed on this commit: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} (which job, and its first failing check, are in the run). Locally, on purpose: REMY_FLOW=hand mise run <that job's task>. dev:promote refuses this commit until a run is green."
        run: gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$BODY" > /dev/null

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.12 # mise.toml's min_version
          cache: true
      - run: npm ci --ignore-scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The tag is RELEASE_PACKAGE's version, the notes are CHANGELOG.md's, each package is published
      # unless its version already is, and the GitHub release is created unless it exists.
      - name: Publish and release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: mise run packages:publish -- --release "$TAG"
