# Level 2 checks (Google's Lighthouse audits and Core Web Vitals) on every push to main and
# every version tag, then the release for tags. A release already made locally with
# `mise run ui:release` is detected and left alone, so local and CI releases coexist.
name: Google checks and release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions: {}

# ui:release pushes main and then the tag for the same commit: the tag's run (which releases)
# cancels main's run instead of running level 2 twice. Runs of different commits never collide.
concurrency:
  group: google-${{ github.sha }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  google:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.12 # mise.toml's min_version
          cache: true
      - run: npm ci
      - run: mise run project:typecheck
      - run: mise run project:test:google
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: google-report
          path: playwright-report/local
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: google
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.12 # mise.toml's min_version
          cache: true
      - run: npm ci --ignore-scripts
      - name: Check that the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: test "$TAG" = "v$(node -p "require('./packages/ui/package.json').version")"
      - name: Check the release notes (the same check as scripts/release.sh)
        env:
          TAG: ${{ github.ref_name }}
        run: bash scripts/release-notes.sh "${TAG#v}" > "$RUNNER_TEMP/notes.md"
      - name: Publish unless already published
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$HOME/.npmrc"
          version=$(node -p "require('./packages/ui/package.json').version")
          if npm view "@joeblew999/remy-ui@$version" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@joeblew999/remy-ui@$version is already published (local release)."
          else
            mise run ui:generate
            npm publish --workspace @joeblew999/remy-ui --ignore-scripts
          fi
      - name: Create the GitHub release unless it exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG already released."; exit 0; fi
          gh release create "$TAG" --title "Shared UI ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
