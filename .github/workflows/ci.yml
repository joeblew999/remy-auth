# The heavy checks, on GitHub after every push to main, on every pull request and on every version tag, in parallel, while
# the developer keeps coding; then the release for tags. Every job is one part of `npm run ci`, and the same
# command runs the same parts anywhere: `npm run ci` locally (all of them, in turn) gives GitHub's answer.
# Every Remy repo runs this same workflow (.plans/thin-apps.md, group 6): remy-auth through the triggers
# below, any other repo by calling it at the tag its package is on, which `remy upgrade` moves with it:
#
#   on: { push: { branches: [main], tags: ['v*'] }, workflow_dispatch: {} }
#   permissions: {}
#   jobs:
#     checks:
#       uses: joeblew999/remy-auth/.github/workflows/ci.yml@vX.Y.Z
#       permissions: { contents: write, packages: write }
#
# Every step is a package.json script, so the caller's own package.json decides what runs. The release
# job runs only for a tag and publishes only what is new (remy packages publish), so a release already
# made locally with npm run dev:release is left alone; a repository that publishes no packages never
# tags. npm ci reads @joeblew999/remy-ui from GitHub Packages with the run's token (the app's .npmrc),
# once the package grants the repository read access ("Manage Actions access").
# Named for what it runs (`npm run ci`); called google.yml until 2026-10-17.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  # A pull request too, so Dependabot's (the pinned actions, .github/dependabot.yml) arrives checked.
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions: {}

# The release's tag step pushes main and then the tag for the same commit: the tag's run (which releases)
# cancels main's run instead of running everything twice. Runs of different commits never collide.
concurrency:
  group: checks-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  # Parallel jobs that share nothing, so the answer comes back in the time of the longest. Each job is
  # one part of `npm run ci`, the same command a person or an agent runs locally (ci.ts), and the workflow
  # holds nothing else: what ci needs (Playwright's Chromium, the Han fonts) it installs itself.
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: types and unit
            part: check
          - name: every language 1/3
            part: every --shard 1/3
          - name: every language 2/3
            part: every --shard 2/3
          - name: every language 3/3
            part: every --shard 3/3
          - name: google
            part: google
          - name: consumers
            part: consumers
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # the comment on a red commit below; nothing else writes
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Two commits: on a pull request the checkout is the merge commit, and its first parent (the base
          # branch) is what ci compares against to skip a part nothing it checks changed (unchanged.ts).
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      # Kept between runs: Playwright's Chromium (ci installs it when missing, keyed on the lockfile that
      # pins Playwright) and the consumer fixture's skills download (keyed on the pinned list).
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: matrix.part == 'consumers'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: /tmp/remy-fixture-skills
          key: remy-fixture-skills-${{ hashFiles('packages/ui/src/cli/skills.ts', 'packages/ui/skills/**') }}
      - run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run ci -- ${{ matrix.part }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-${{ strategy.job-index }}
          path: playwright-report/local
          retention-days: 14
          if-no-files-found: ignore
      # A red job reaches the person who pushed without anybody polling: a comment on the commit,
      # which GitHub sends to its author, naming this job and its part. dev:promote refuses a commit
      # whose run is not green; dev:status and dev:land say main is red.
      - if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: "The checks failed on this commit, job \"${{ matrix.name }}\" (npm run ci -- ${{ matrix.part }}): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Locally the same command reproduces it: npm run ci -- ${{ matrix.part }}."
        run: gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$BODY" > /dev/null

  # (A red job writes on the commit itself, in its own last step above, naming itself.)

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The tag is the release package's version, the notes are CHANGELOG.md's, each package is published
      # unless its version already is, and the GitHub release is created unless it exists.
      - name: Publish and release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: npm run packages -- publish --release "$TAG"
