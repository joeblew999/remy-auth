# The checks, on GitHub for a pull request or by hand, in parallel; the release for a version tag. Every job is one
# part of `vp run ci` (the root package.json script), `vp run <part>`, the same command anywhere: `vp run ci` locally runs them all in turn (every check, the
# browser checks, Google's audits). Vite Plus's task cache, kept between runs, replays what nothing changed; nothing of ours
# decides what to skip.
# Every Remy repo runs this same workflow (.plans/thin-apps.md, group 6): remy-auth through the triggers
# below, any other repo by calling it at the tag its package is on, which `remy upgrade` moves with it:
#
#   on: { pull_request: {}, workflow_dispatch: {} }
#   permissions: {}
#   jobs:
#     checks:
#       uses: joeblew999/remy-auth/.github/workflows/ci.yml@vX.Y.Z
#       permissions: { contents: write, packages: write }
#
# Every step is a task or script the caller defines (its vite.config.ts and package.json), so the caller decides what
# runs. vp install reads @joeblew999/remy-ui from GitHub Packages with the run's token, put where pnpm reads it (pnpm
# expands no variable in a repository's .npmrc), once the package grants the repository read access ("Manage Actions
# access").
# The release job runs only for a tag: vp run release ran every check and tagged; this job publishes what Changesets
# versioned (changeset publish, pnpm publish for each package whose version is new) and makes the GitHub release.
# Named for what it runs (`vp run ci`); called google.yml until 2026-10-17.
name: CI

# Not on a push to main: the push's own hook ran `vp run ci` before anything left the machine (owner, 2026-10-18).
# A version tag, to publish; a pull request, so Dependabot's (the pinned actions, .github/dependabot.yml) arrives
# checked; and by hand (gh workflow run ci.yml).
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  # Parallel jobs that share nothing, so the answer comes back in the time of the longest. Each job is
  # one part of `vp run ci`, the same command a person or an agent runs locally (a unit check holds this list to
  # the script). Playwright's Chromium is the browsers task (playwright install chromium); a Linux runner has no Han
  # font, which the font checks need, so it is installed here.
  checks:
    # Not for a release's tag: vp run release ran every check before it tagged.
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ready
            task: ready
          - name: browser 1/3
            task: test:browser --shard 1/3
          - name: browser 2/3
            task: test:browser --shard 2/3
          - name: browser 3/3
            task: test:browser --shard 3/3
          - name: audits
            task: test:audits
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Vite Plus: the global vp, the Node .node-version pins and the npm package.json pins (managed, as on every
      # machine), then vp install from the lockfile, its packages cached between runs.
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          cache: true
          run-install: false
      - run: |
          pnpm config set --location user //npm.pkg.github.com/:_authToken "$GITHUB_TOKEN"
          vp install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: startsWith(matrix.task, 'test:')
        run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      # Vite Plus's task cache, restored after the install (which recreates node_modules): what an earlier run of
      # this job already checked on the same inputs is replayed, not run again. Keyed per run, restored from the
      # newest of this job's, then any job's.
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-
            vite-task-${{ runner.os }}-${{ runner.arch }}-
      # Kept between runs: Playwright's Chromium (the browsers task installs it when missing, keyed on the lockfile
      # that pins Playwright).
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: vp run ${{ matrix.task }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: success()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-${{ strategy.job-index }}
          path: '**/playwright-report/local'

          retention-days: 14
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          cache: true
          run-install: false
      - run: |
          pnpm config set --location user //npm.pkg.github.com/:_authToken "$GITHUB_TOKEN"
          vp install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Each package whose version is new on its registry (changeset publish, after what the packages ship is
      # generated and built), then the GitHub release, its notes GitHub's own.
      - run: vp run release:publish
      - run: gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
