# The checks, on GitHub after every push to main, on every pull request and on every version tag, in parallel, while
# the developer keeps coding; then the release for tags. Every job is one part of `vp run ci` (the root package.json
# script), `vp run <part>`, the same command anywhere: `vp run ci` locally runs them all in turn (every check, the
# browser checks, Google's audits, and in remy-auth the new app). Vite Plus's task cache, kept between runs, replays what nothing changed; nothing of ours
# decides what to skip.
# Every Remy repo runs this same workflow (.plans/thin-apps.md, group 6): remy-auth through the triggers
# below, any other repo by calling it at the tag its package is on, which `remy upgrade` moves with it:
#
#   on: { push: { branches: [main], tags: ['v*'] }, workflow_dispatch: {} }
#   permissions: {}
#   jobs:
#     checks:
#       uses: joeblew999/remy-auth/.github/workflows/ci.yml@vX.Y.Z
#       permissions: { contents: write, packages: write }
#
# Every step is a task or script the caller defines (its vite.config.ts and package.json), so the caller decides what
# runs.
# The release job runs only for a tag and publishes what is new (vp run publish): vp run release checks and tags
# locally, and this job is where the packages are published; a repository that publishes no packages never tags. vp install
# reads @joeblew999/remy-ui from GitHub Packages with the run's token (the app's .npmrc), once the package grants the
# repository read access ("Manage Actions access").
# Named for what it runs (`vp run ci`); called google.yml until 2026-10-17.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  # A pull request too, so Dependabot's (the pinned actions, .github/dependabot.yml) arrives checked.
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions: {}

# The release's tag step pushes main and then the tag for the same commit: the tag's run (which releases)
# cancels main's run instead of running everything twice. Runs of different commits never collide.
concurrency:
  group: checks-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  # Parallel jobs that share nothing, so the answer comes back in the time of the longest. Each job is
  # one part of `vp run ci`, the same command a person or an agent runs locally (a unit check holds this list to
  # the script), and the workflow holds nothing else: what a browser task needs (Playwright's Chromium, the Han
  # fonts) is a task too (browsers).
  checks:
    # Not for a release's tag: vp run release ran every check, in every language, before it tagged.
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ready
            task: ready
          - name: browser 1/3
            task: test:browser --shard 1/3
          - name: browser 2/3
            task: test:browser --shard 2/3
          - name: browser 3/3
            task: test:browser --shard 3/3
          - name: audits
            task: test:audits
          - name: new-app
            task: new-app
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # the comment on a red commit below; nothing else writes
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Vite Plus: the global vp, the Node .node-version pins and the npm package.json pins (managed, as on every
      # machine), then vp install from the lockfile, its packages cached between runs.
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Vite Plus's task cache, restored after the install (which recreates node_modules): what an earlier run of
      # this job already checked on the same inputs is replayed, not run again. Keyed per run, restored from the
      # newest of this job's, then any job's.
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-
            vite-task-${{ runner.os }}-${{ runner.arch }}-
      # Kept between runs: Playwright's Chromium (the browsers task installs it when missing, keyed on the lockfile
      # that pins Playwright) and the consumer fixture's skills download (keyed on the pinned list).
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: matrix.name == 'new-app'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: /tmp/remy-fixture-skills
          key: remy-fixture-skills-${{ hashFiles('packages/remy-cli/src/skills.ts', 'packages/remy-ui/skills/**') }}
      # The new-app test is remy-auth's alone (it builds an app from template/); in an app that calls this workflow
      # the job passes, saying so.
      - if: matrix.task == 'new-app' && hashFiles('fixtures/consumer/run.sh') == ''
        run: echo "There is no new-app test in this repository (it is remy-auth's), so nothing runs."
      - if: matrix.task != 'new-app' || hashFiles('fixtures/consumer/run.sh') != ''
        run: vp run ${{ matrix.task }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: success()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-${{ strategy.job-index }}
          path: '**/playwright-report/local'

          retention-days: 14
          if-no-files-found: ignore
      # A red job reaches the person who pushed without anybody polling: a comment on the commit,
      # which GitHub sends to its author, naming this job and its part (gh run list says it too).
      - if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: 'The checks failed on this commit, job "${{ matrix.name }}" (vp run ${{ matrix.task }}): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Locally the same command reproduces it: vp run ${{ matrix.task }}.'
        run: gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$BODY" > /dev/null

  # (A red job writes on the commit itself, in its own last step above, naming itself.)

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          cache: true
          run-install: |
            - args: ['--frozen-lockfile', '--ignore-scripts']
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The tag is the release package's version, the notes are CHANGELOG.md's, each package is published
      # unless its version already is, and the GitHub release is created unless it exists.
      - name: Publish and release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: vp run publish --release "$TAG"
