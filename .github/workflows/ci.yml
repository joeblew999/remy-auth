# The checks, on GitHub for a pull request or by hand, in parallel; the release (publishing) for a push to main. Every job is one
# part of `vp run ci` (the root package.json script), `vp run <part>`, the same command anywhere: `vp run ci` locally runs them all in turn (every check, the
# browser checks, Google's audits). Vite Plus's task cache, kept between runs, replays what nothing changed; nothing of ours
# decides what to skip.
# Every Remy repo runs this same workflow (issue #34, group 6): remy-auth through the triggers
# below, any other repo by calling it at the tag its package is on, which `remy upgrade` moves with it:
#
#   on: { pull_request: {}, workflow_dispatch: {} }
#   permissions: {}
#   jobs:
#     checks:
#       uses: joeblew999/remy-auth/.github/workflows/ci.yml@vX.Y.Z
#       permissions: { contents: write, packages: write }
#
# Every step is a task or script the caller defines (its vite.config.ts and package.json), so the caller decides what
# runs. vp install reads @joeblew999/remy-ui from GitHub Packages with the run's token (setup-vp's registry-url, the
# token from NODE_AUTH_TOKEN), once the package grants the repository read access ("Manage Actions access").
# The release job runs for a push to main: vp run release ran every check and pushed; this job publishes what Changesets
# versioned (changeset publish, pnpm publish for each package whose version is new), then tags it and makes the GitHub release.
# Named for what it runs (`vp run ci`); called google.yml until 2026-10-17.
name: CI

# Every push to main runs the checks here, where no hook can be skipped (issue #43): the release job publishes only once
# they and the new-app test pass. A pull request runs the checks too, so Dependabot's (the pinned actions,
# .github/dependabot.yml) arrives checked; and by hand (gh workflow run ci.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  # Parallel jobs that share nothing, so the answer comes back in the time of the longest. Each job is
  # one part of `vp run ci`, the same command a person or an agent runs locally (a unit check holds this list to
  # the script). Playwright's Chromium is the browsers task (playwright install chromium); a Linux runner has no Han
  # font, which the font checks need, so it is installed here.
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ready
            task: ready
          - name: browser 1/3
            task: test:browser --shard 1/3
          - name: browser 2/3
            task: test:browser --shard 2/3
          - name: browser 3/3
            task: test:browser --shard 3/3
          - name: docs
            task: test:docs
          - name: audits
            task: test:audits
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    # GitHub Packages' token for every pnpm command in the job (setup-vp's .npmrc reads it).
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Vite Plus: the global vp, the Node .node-version pins and the npm package.json pins (managed, as on every
      # machine), then vp install from the lockfile, its packages cached between runs. registry-url and scope: the
      # .npmrc for GitHub Packages, its token the job's NODE_AUTH_TOKEN.
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          cache: true
          registry-url: https://npm.pkg.github.com
          scope: '@joeblew999'
      - if: startsWith(matrix.task, 'test:')
        run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      # Vite Plus's task cache, restored after the install (which recreates node_modules): what an earlier run of
      # this job already checked on the same inputs is replayed, not run again. Keyed per run, restored from the
      # newest of this job's, then any job's.
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-
            vite-task-${{ runner.os }}-${{ runner.arch }}-
      # Kept between runs: Playwright's Chromium (the browsers task installs it when missing, keyed on the lockfile
      # that pins Playwright).
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: vp run ${{ matrix.task }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-${{ strategy.job-index }}
          path: '**/playwright-report/local'

          retention-days: 14
          if-no-files-found: ignore

  # The new-app test (vp run new-app, fixtures/consumer/run.sh): a new app made with vp create from this commit's
  # packed packages installs, builds and passes its checks. remy-auth's own (apps that call this workflow have no such
  # test), and the release waits for it, so nothing is published that a new app cannot use.
  new-app:
    if: github.repository == 'joeblew999/remy-auth'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          cache: true
          registry-url: https://npm.pkg.github.com
          scope: '@joeblew999'
      - run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-new-app-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-new-app-
            vite-task-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: vp run new-app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-new-app-${{ github.run_id }}-${{ github.run_attempt }}

  # The upgrade test (vp run upgrade-test, fixtures/consumer/upgrade.sh): an app made from the latest published release,
  # upgraded to this commit's packages as the docs say, passes its checks. remy-auth's own; the release waits for it.
  upgrade:
    if: github.repository == 'joeblew999/remy-auth'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          cache: true
          registry-url: https://npm.pkg.github.com
          scope: '@joeblew999'
      - run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-upgrade-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-upgrade-
            vite-task-${{ runner.os }}-${{ runner.arch }}-
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: vp run upgrade-test
        env:
          # Empty unless set: the release to upgrade from while the latest is known broken (projects.md).
          UPGRADE_FROM: ${{ vars.UPGRADE_FROM }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-upgrade-${{ github.run_id }}-${{ github.run_attempt }}

  # Changesets' own way to publish: on main, each package whose version is not on its registry yet is published
  # (changeset publish); a push that versioned nothing publishes nothing, in seconds. Then the release's tag (vX.Y.Z, the
  # platform's version, which apps' workflows and remy upgrade name) and its GitHub release, made here with GitHub's
  # token. Only in remy-auth, the repository that releases with Changesets.
  release:
    if: github.event_name == 'push' && github.repository == 'joeblew999/remy-auth'
    # Only from a commit every check, the new-app test and the upgrade test passed, here.
    needs: [checks, new-app, upgrade]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    # GitHub Packages' token for every pnpm command in the job (setup-vp's .npmrc reads it).
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          cache: true
          registry-url: https://npm.pkg.github.com
          scope: '@joeblew999'
      # changeset publish publishes only what the registry lacks (nothing, after most pushes). The platform's version
      # tag and GitHub release follow once, when that version has none yet.
      - run: vp run release:publish
      - run: |
          TAG="v$(node -p "require('./packages/remy-ui/package.json').version")"
          if git ls-remote --exit-code --tags origin "$TAG" > /dev/null; then echo "$TAG is released already."; exit 0; fi
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
