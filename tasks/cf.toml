# Cloudflare CLI, logs and deployment over the including project's pinned Wrangler; cf:deploy builds
# with DEPLOY_ORIGIN as the public origin.

["cf:cli"]
description = "Run the pinned Cloudflare CLI (pass --help for commands)"
raw_args = true
dir = "{{config_root}}"
run = "./node_modules/.bin/wrangler"

["cf:logs"]
description = "Stream deployed Worker logs as JSON (requires Cloudflare login and deployment)"
raw_args = true
dir = "{{config_root}}"
run = "./node_modules/.bin/wrangler tail --format json"

["cf:errors"]
description = "Stream deployed Worker invocation failures (not all HTTP 4xx/5xx responses)"
raw_args = true
dir = "{{config_root}}"
run = "./node_modules/.bin/wrangler tail --format json --status error"

["cf:deploy"]
description = "Build with DEPLOY_ORIGIN as the public origin and upload to the authenticated Cloudflare account"
dir = "{{config_root}}"
run = ["PUBLIC_ORIGIN=\"$DEPLOY_ORIGIN\" ./node_modules/.bin/react-router build", "./node_modules/.bin/wrangler deploy"]
