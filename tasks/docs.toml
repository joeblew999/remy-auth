# The docs Worker's tasks, the same in every app. The Worker is @joeblew999/remy-ui's (src/docs: Fumadocs'
# TanStack Start template on Cloudflare); an app's docs/ holds content/, docs.config.ts and three one-line
# files (`docs:init` writes them). Its Cloudflare configuration is generated from docs.config.ts into
# docs/.remy-docs/wrangler.json by the Vite preset, so every wrangler command here reads that (-c); a task
# that runs without a build writes it first by loading the app's vite.config.ts (`node vite.config.ts`, ~1 s).
# [env] inputs: DOCS_ORIGIN, VITE_DOCS_ORIGIN, DOCS_PREVIEW_PORT, I18N_DOCS_DIR. docs:observe and
# docs:ai-gateway are file tasks in docs/ (tasks/docs/).

["docs:dev"]
description = "LOCAL: the docs Worker with hot reload, http://127.0.0.1:5174/docs, /dev, /reference. With CLOUDFLARE_ENV=ask, Ask AI answers from the production index (each question is a model call)"
dir = "{{config_root}}"
# In TypeScript now (packages/ui/src/cli, remy docs dev): forwards for whoever still types mise run, and goes with mise.
run = "if [ -f packages/ui/src/cli/remy.ts ]; then node packages/ui/src/cli/remy.ts docs dev; else node ./node_modules/@joeblew999/remy-ui/cli/remy.js docs dev; fi"

["docs:build"]
description = "LOCAL: build the docs Worker (docs/dist) (~20 s)"
dir = "{{config_root}}"
# In TypeScript now (packages/ui/src/cli, remy docs build): forwards for whoever still types mise run, and goes with mise.
run = "if [ -f packages/ui/src/cli/remy.ts ]; then node packages/ui/src/cli/remy.ts docs build; else node ./node_modules/@joeblew999/remy-ui/cli/remy.js docs build; fi"

["docs:check"]
description = "LOCAL: the docs Worker's check: build (which writes .remy-docs/), binding types, typecheck (~30 s); project:check runs it"
dir = "{{config_root}}"
# In TypeScript now (packages/ui/src/cli, remy docs check): forwards for whoever still types mise run, and goes with mise.
run = "if [ -f packages/ui/src/cli/remy.ts ]; then node packages/ui/src/cli/remy.ts docs check; else node ./node_modules/@joeblew999/remy-ui/cli/remy.js docs check; fi"

["docs:test"]
description = "LOCAL: build, then the docs Worker's few checks (the package's src/docs/tests) on Cloudflare's local runtime at DOCS_PREVIEW_PORT (~30 s)"
dir = "{{config_root}}"
# In TypeScript now (packages/ui/src/cli, remy docs test): forwards for whoever still types mise run, and goes with mise.
run = "if [ -f packages/ui/src/cli/remy.ts ]; then node packages/ui/src/cli/remy.ts docs test; else node ./node_modules/@joeblew999/remy-ui/cli/remy.js docs test; fi"

["docs:test:remote"]
description = "REMOTE, read only: the docs checks, Google's Lighthouse audits and every MCP server the app has (the MCP Inspector) against DOCS_TEST_URL, default DOCS_ORIGIN (~1 min)"
dir = "{{config_root}}"
# In TypeScript now (packages/ui/src/cli, remy docs test remote): forwards for whoever still types mise run, and goes with mise.
run = "if [ -f packages/ui/src/cli/remy.ts ]; then node packages/ui/src/cli/remy.ts docs test remote; else node ./node_modules/@joeblew999/remy-ui/cli/remy.js docs test remote; fi"

["docs:preview"]
description = "REMOTE: deploy this build as the docs Worker's one preview, <name>-preview (overwritten each time, production untouched), answers paused; DOCS_TEST_URL=<its URL> mise run docs:test:remote checks it"
dir = "{{config_root}}"
# In TypeScript now (packages/ui/src/cli, remy docs preview): forwards for whoever still types mise run, and goes with mise.
run = "if [ -f packages/ui/src/cli/remy.ts ]; then node packages/ui/src/cli/remy.ts docs preview; else node ./node_modules/@joeblew999/remy-ui/cli/remy.js docs preview; fi"

["docs:deploy"]
description = "REMOTE, PRODUCTION: build and deploy the docs Worker to DOCS_ORIGIN (~1 min), then docs:publish"
dir = "{{config_root}}"
# In TypeScript now (packages/ui/src/cli/cloudflare.ts): forwards for whoever still types mise run, and goes with mise.
run = "if [ -f packages/ui/src/cli/remy.ts ]; then node packages/ui/src/cli/remy.ts cloudflare docs-deploy; else node ./node_modules/@joeblew999/remy-ui/cli/remy.js cloudflare docs-deploy; fi"

["docs:publish"]
description = "REMOTE, PRODUCTION: make Ask AI's R2 bucket hold exactly the pages the live docs Worker serves, start an AI Search sync, then check the fixed questions find their pages (docs/content/questions.json); nothing when docs.config.ts has no `ask` (~1 min)"
dir = "{{config_root}}"
# In TypeScript now (packages/ui/src/cli, remy docs publish): forwards for whoever still types mise run, and goes with mise.
run = "if [ -f packages/ui/src/cli/remy.ts ]; then node packages/ui/src/cli/remy.ts docs publish; else node ./node_modules/@joeblew999/remy-ui/cli/remy.js docs publish; fi"

["docs:answers:off"]
description = "REMOTE, PRODUCTION: stop Ask AI's answers now (the secret ASK_PAUSED; no model calls, the docs stay). Seconds, no build"
dir = "{{config_root}}"
# In TypeScript now (packages/ui/src/cli, remy docs answers off): forwards for whoever still types mise run, and goes with mise.
run = "if [ -f packages/ui/src/cli/remy.ts ]; then node packages/ui/src/cli/remy.ts docs answers off; else node ./node_modules/@joeblew999/remy-ui/cli/remy.js docs answers off; fi"

["docs:answers:on"]
description = "REMOTE, PRODUCTION: resume Ask AI's answers (delete the secret ASK_PAUSED; Wrangler asks you to confirm)"
dir = "{{config_root}}"
# In TypeScript now (packages/ui/src/cli, remy docs answers on): forwards for whoever still types mise run, and goes with mise.
run = "if [ -f packages/ui/src/cli/remy.ts ]; then node packages/ui/src/cli/remy.ts docs answers on; else node ./node_modules/@joeblew999/remy-ui/cli/remy.js docs answers on; fi"

["docs:init"]
description = "Start this app's docs at a remy-auth tag: docs/ with docs.config.ts (the product's names), vite.config.ts (the API contract's package), tsconfig.json, package.json and an index page per site; then add \"docs\" to package.json workspaces. The Worker itself is @joeblew999/remy-ui's. Refuses to overwrite an existing docs/"
usage = 'arg "<ref>" help="The remy-auth tag to take the docs app from, e.g. v0.12.0 (match your @joeblew999/remy-ui version)"'
dir = "{{config_root}}"
# In TypeScript now (packages/ui/src/cli, remy docs init <ref>): forwards for whoever still types mise run, and goes with mise.
run = "if [ -f packages/ui/src/cli/remy.ts ]; then node packages/ui/src/cli/remy.ts docs init \"${usage_ref}\"; else node ./node_modules/@joeblew999/remy-ui/cli/remy.js docs init \"${usage_ref}\"; fi"