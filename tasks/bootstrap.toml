# Shared agent bootstrap: pinned official skills, Chrome DevTools, Google's web guidance and
# project MCP registration. remy-auth includes this directory locally; other projects include
# it by git reference pinned to a commit, for example
#   [task_config]
#   includes = ["git::https://github.com/joeblew999/remy-auth.git//tasks?ref=<commit>"]
# Consumers provide the npm packages the tasks run: chrome-devtools-mcp, modern-web-guidance,
# smol-toml (and @openai/codex for mcp:status). The *_skills_source vars below are the only
# list of skill sources; verification rejects skills installed from anything else.

["skills:install"]
description = "Install official auth, Cloudflare, Chrome DevTools, modern web, React Router, shadcn, Playwright and GitHub release skills for Codex and Claude"
dir = "{{config_root}}"
vars = { skills_cli_version = "1.7.0",
  better_auth_skills_source = "https://github.com/better-auth/skills/tree/20c9e88a5c007461a703f1c213572b073196113e",
  cloudflare_skills_source = "https://github.com/cloudflare/skills/tree/6dc7604903127485e7e4cb26314651ebd4a4df19",
  chrome_skills_source = "https://github.com/ChromeDevTools/chrome-devtools-mcp/tree/6a7e51fecaaefbea46b89e68892d42c175ee9163",
  modern_web_skills_source = "https://github.com/GoogleChrome/modern-web-guidance/tree/22ab18dfb50a5d7e3bdcf471c14076a5534eae4e",
  react_router_skills_source = "https://github.com/remix-run/react-router/tree/2d9827bc09bc562647553f8abf026823e3bfd9dd",
  shadcn_skills_source = "https://github.com/shadcn-ui/ui/tree/98a1fe67b439324ddc857f47fbdce056600a4329",
  playwright_skills_source = "https://github.com/microsoft/playwright-cli/tree/74354ecc7a43da16d91a9bc54fa8db8283a3fcf5",
  github_skills_source = "https://github.com/github/awesome-copilot/tree/1f5644080a525d26a2e24f61a7609fb9b261c21a" }
run = [
  "npx --yes skills@{{vars.skills_cli_version}} add {{vars.better_auth_skills_source}} --skill '*' --agent codex claude-code --full-depth --yes",
  "npx --yes skills@{{vars.skills_cli_version}} add {{vars.cloudflare_skills_source}} --skill '*' --agent codex claude-code --full-depth --yes",
  "npx --yes skills@{{vars.skills_cli_version}} add {{vars.chrome_skills_source}} --skill '*' --agent codex claude-code --full-depth --yes",
  "npx --yes skills@{{vars.skills_cli_version}} add {{vars.modern_web_skills_source}} --skill modern-web-guidance --agent codex claude-code --full-depth --yes",
  "npx --yes skills@{{vars.skills_cli_version}} add {{vars.react_router_skills_source}} --skill react-router --agent codex claude-code --full-depth --yes",
  "npx --yes skills@{{vars.skills_cli_version}} add {{vars.shadcn_skills_source}} --skill shadcn --agent codex claude-code --full-depth --yes",
  "npx --yes skills@{{vars.skills_cli_version}} add {{vars.playwright_skills_source}} --skill playwright-cli --agent codex claude-code --full-depth --yes",
  "npx --yes skills@{{vars.skills_cli_version}} add {{vars.github_skills_source}} --skill github-release --skill github-actions-hardening --agent codex claude-code --full-depth --yes",
]

["skills:list"]
description = "List project-local skills for Codex and Claude"
dir = "{{config_root}}"
vars = { skills_cli_version = "1.7.0" }
run = "npx --yes skills@{{vars.skills_cli_version}} list --agent codex claude-code"

["skills:remove"]
description = "Remove all project-local skills for Codex and Claude (restore with mise run skills:install)"
dir = "{{config_root}}"
vars = { skills_cli_version = "1.7.0" }
run = "npx --yes skills@{{vars.skills_cli_version}} remove --all"

["mcp:verify"]
description = "Verify project MCP registration matches this checkout and mise installation"
dir = "{{config_root}}"
run = "mise run mcp:register -- --check"

["mcp:status"]
description = "Show Chrome DevTools registration in both installed agent clients"
dir = "{{config_root}}"
run = ["./node_modules/.bin/codex mcp get chrome-devtools", "claude mcp get chrome-devtools"]

["browser:cli"]
description = "Run Google's Chrome DevTools CLI"
raw_args = true
dir = "{{config_root}}"
run = "./node_modules/.bin/chrome-devtools"

["browser:mcp"]
description = "Run Google's Chrome DevTools MCP server over stdio"
raw_args = true
dir = "{{config_root}}"
run = "./node_modules/.bin/chrome-devtools-mcp --isolated --headless --no-usage-statistics --no-performance-crux"

["browser:start"]
description = "Start an isolated Chrome session (pass --headless=false for a visible window)"
raw_args = true
dir = "{{config_root}}"
run = "./node_modules/.bin/chrome-devtools start --isolated --headless --no-usage-statistics --no-performance-crux"

["browser:stop"]
description = "Stop the Chrome DevTools CLI session"
dir = "{{config_root}}"
run = "./node_modules/.bin/chrome-devtools stop"

["web:guidance"]
description = "Search and retrieve Google modern web implementation guidance"
raw_args = true
dir = "{{config_root}}"
env = { DISABLE_TELEMETRY = "1" }
run = "./node_modules/.bin/modern-web-guidance"
