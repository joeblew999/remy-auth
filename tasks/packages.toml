# Tasks for a repository that publishes packages of its own (npm workspaces that are not private), remy-auth
# and any other Remy repo alike (.plans/thin-apps.md, group 6). The workspace list in package.json drives
# them (packages/workspaces.mjs); RELEASE_PACKAGE in mise.toml [env] names the package whose version tags a
# release, and RELEASE_TITLE its title. A repository without such workspaces has nothing to pack or publish.
# File tasks in packages/: check, upgrade, pack, notes, bumped, tag, publish.

["packages:release"]
description = "Release: the gates one after another (translations strict, project:verify, project:release-checks, Google's audits locally and Core Web Vitals on a Cloudflare preview; ~5 min, uses dist/ and PREVIEW_PORT, so nothing else local at the same time), then packages:tag (tag, push, publish, GitHub release). CI repeats the audits on the tag"
dir = "{{config_root}}"
# In TypeScript now (packages/ui/src/cli/packages.ts, remy packages release; dev:release runs it): forwards for whoever still types mise run, and goes with mise.
run = "if [ -f packages/ui/src/cli/remy.ts ]; then node packages/ui/src/cli/remy.ts packages release; else node ./node_modules/@joeblew999/remy-ui/cli/remy.js packages release; fi"
