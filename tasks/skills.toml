# Pinned official agent skills for Codex and Claude. The *_skills_source vars of skills:install are the
# only list of skill sources; verification rejects skills installed from anything else.

["skills:install"]
description = "Install official auth, Cloudflare, Chrome DevTools, modern web, shadcn, Playwright, GitHub release and TanStack Router/Start skills for Codex and Claude"
dir = "{{config_root}}"
# In TypeScript now (packages/ui/src/cli, remy skills install): forwards for whoever still types mise run, and goes with mise.
run = "if [ -f packages/ui/src/cli/remy.ts ]; then node packages/ui/src/cli/remy.ts skills install; else node ./node_modules/@joeblew999/remy-ui/cli/remy.js skills install; fi"

["skills:list"]
description = "List project-local skills for Codex and Claude"
dir = "{{config_root}}"
# In TypeScript now (packages/ui/src/cli, remy skills list): forwards for whoever still types mise run, and goes with mise.
run = "if [ -f packages/ui/src/cli/remy.ts ]; then node packages/ui/src/cli/remy.ts skills list; else node ./node_modules/@joeblew999/remy-ui/cli/remy.js skills list; fi"

["skills:remove"]
description = "Remove all project-local skills for Codex and Claude (restore with mise run skills:install)"
dir = "{{config_root}}"
# In TypeScript now (packages/ui/src/cli, remy skills remove): forwards for whoever still types mise run, and goes with mise.
run = "if [ -f packages/ui/src/cli/remy.ts ]; then node packages/ui/src/cli/remy.ts skills remove; else node ./node_modules/@joeblew999/remy-ui/cli/remy.js skills remove; fi"