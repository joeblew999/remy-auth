# Default pipeline for a TanStack Start app on Cloudflare built on @joeblew999/remy-ui, driven by the
# including project's [env] inputs PREVIEW_PORT and DEPLOY_ORIGIN. Override a task by defining the
# same name in the project's own mise.toml.

["project:test:remote"]
description = "Both levels against TEST_BASE_URL (~90 s). Touches no local build or port: run it in the background and keep coding"
dir = "{{config_root}}"
env = { TEST_TARGET = "remote" }
run = "./node_modules/.bin/playwright test"

["project:report"]
description = "Open the HTML report from the last local project:test run"
dir = "{{config_root}}"
raw = true
run = "./node_modules/.bin/playwright show-report playwright-report/local"

["project:report:remote"]
description = "Open the HTML report from the last project:test:remote run"
dir = "{{config_root}}"
raw = true
run = "./node_modules/.bin/playwright show-report playwright-report/remote"

["project:setup"]
description = "Install dependencies (GITHUB_TOKEN with read:packages for the shared UI), the shared skills and MCP registration, then verify"
dir = "{{config_root}}"
run = ["npm ci", { task = "skills:install" }, { task = "mcp:register" }, { task = "project:verify" }]

["project:typecheck"]
description = "Generate Worker types and check the app (the committed src/routeTree.gen.ts is regenerated by dev and build)"
dir = "{{config_root}}"
run = ["./node_modules/.bin/wrangler types", "./node_modules/.bin/tsc"]

["project:dev"]
description = "Run the app with hot reload (port from vite.config.ts)"
dir = "{{config_root}}"
raw = true
run = "./node_modules/.bin/vite dev"

["project:build"]
description = "Build the deployable artifact and dry-run the Cloudflare deployment"
dir = "{{config_root}}"
run = ["./node_modules/.bin/vite build", "./node_modules/.bin/wrangler deploy --dry-run"]

["project:preview"]
description = "Build, then serve the production artifact on Cloudflare's local host at PREVIEW_PORT"
dir = "{{config_root}}"
depends = ["project:build"]
raw = true
run = "./node_modules/.bin/wrangler dev --ip 127.0.0.1 --port \"${PREVIEW_PORT:-4173}\""

["project:test"]
description = "Level 1: build, then run our own browser and HTTP checks against the production artifact locally (every language; ~20 s with 3 languages). Uses dist/ and PREVIEW_PORT: never two local levels at once"
dir = "{{config_root}}"
depends = ["project:build"]
env = { TEST_TARGET = "local" }
run = "./node_modules/.bin/playwright test --project=ours"

["project:test:quick"]
description = "Quick tier for the edit loop: build, then every check of ours in QUICK_LOCALES only (default en and ar: the base language and right to left). Not a gate: project:verify, releases and CI run every language"
dir = "{{config_root}}"
depends = ["project:build"]
env = { TEST_TARGET = "local", CHECK_LOCALES = "{{ env.QUICK_LOCALES | default(value='en,ar') }}" }
run = "./node_modules/.bin/playwright test --project=ours"

["project:test:google"]
description = "Level 2: build, then run Google's Lighthouse audits and Core Web Vitals locally (slow, ~90 s; CI runs this). Uses dist/, PREVIEW_PORT and the Chrome DevTools daemon: never alongside another local level or a remote level 2"
dir = "{{config_root}}"
depends = ["project:build"]
env = { TEST_TARGET = "local" }
run = "./node_modules/.bin/playwright test --project=google --project=google-cwv"

["project:verify"]
description = "Level 1: verify tasks, dependencies, MCP registration, types and our own checks (fast)"
dir = "{{config_root}}"
run = ["mise tasks validate", "npm ls --depth=0", { task = "mcp:verify" }, { task = "project:typecheck" }, { task = "project:test" }]
