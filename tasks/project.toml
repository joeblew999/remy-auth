# Default pipeline for a TanStack Start app on Cloudflare built on @joeblew999/remy-ui, driven by the
# including project's [env] inputs PREVIEW_PORT and DEPLOY_ORIGIN. Override a task by defining the
# same name in the project's own mise.toml.

["project:test:remote"]
description = "Both levels against TEST_BASE_URL, default DEPLOY_ORIGIN (~90 s). Touches no local build or port: run it in the background and keep coding"
dir = "{{config_root}}"
env = { TEST_TARGET = "remote", TEST_BASE_URL = "{{ get_env(name='TEST_BASE_URL', default=env.DEPLOY_ORIGIN) }}" }
run = "./node_modules/.bin/playwright test"

["project:report"]
description = "Open the HTML report from the last local project:test run"
dir = "{{config_root}}"
raw = true
run = "./node_modules/.bin/playwright show-report playwright-report/local"

["project:report:remote"]
description = "Open the HTML report from the last project:test:remote run"
dir = "{{config_root}}"
raw = true
run = "./node_modules/.bin/playwright show-report playwright-report/remote"

["project:setup"]
description = "Install dependencies, the shared skills and MCP registration, then verify (~1.5 min). GITHUB_TOKEN (read:packages, for the shared UI) comes from the shell or else from `gh auth token`"
dir = "{{config_root}}"
# Rendered only when the task runs; gh is asked only when the shell has no GITHUB_TOKEN.
env = { GITHUB_TOKEN = "{% set token = get_env(name='GITHUB_TOKEN', default='') %}{% if token %}{{ token }}{% else %}{{ exec(command='gh auth token') }}{% endif %}" }
run = ["npm ci", { task = "skills:install" }, { task = "mcp:register" }, { task = "project:verify" }]

["project:generate"]
description = "Hook for code an app generates before type checking; none by default. Override it in the project's mise.toml (remy-auth runs ui:generate). Instant"
dir = "{{config_root}}"
run = "true"

["project:typecheck"]
description = "Run project:generate, generate Worker types and check the app (~10 s; the committed src/routeTree.gen.ts is regenerated by dev and build, with TanStack Start's plugin)"
dir = "{{config_root}}"
run = [{ task = "project:generate" }, "./node_modules/.bin/wrangler types", "./node_modules/.bin/tsc"]

["project:dev"]
description = "Run the app with hot reload (port from vite.config.ts)"
dir = "{{config_root}}"
raw = true
run = "./node_modules/.bin/vite dev"

["project:build"]
description = "Build the deployable artifact and dry-run the Cloudflare deployment"
dir = "{{config_root}}"
run = ["./node_modules/.bin/vite build", "./node_modules/.bin/wrangler deploy --dry-run"]

["project:preview"]
description = "Build, then serve the production artifact on Cloudflare's local host at PREVIEW_PORT"
dir = "{{config_root}}"
depends = ["project:build"]
raw = true
run = "./node_modules/.bin/wrangler dev --ip 127.0.0.1 --port \"${PREVIEW_PORT:-4173}\""

["project:test"]
description = "Level 1: build, then run our own browser and HTTP checks against the production artifact locally (every language; ~75 s with 13 languages). Uses dist/ and PREVIEW_PORT: never two local levels at once"
dir = "{{config_root}}"
depends = ["project:build"]
env = { TEST_TARGET = "local" }
run = "./node_modules/.bin/playwright test --project=ours"

["project:test:quick"]
description = "Quick tier for the edit loop: build, then every check of ours in QUICK_LOCALES only (default en and ar: left to right and right to left; languages not configured yet are skipped). Not a gate: project:verify, releases and CI run every language"
dir = "{{config_root}}"
depends = ["project:build"]
env = { TEST_TARGET = "local", CHECK_LOCALES = "{{ env.QUICK_LOCALES | default(value='en,ar') }}" }
run = "./node_modules/.bin/playwright test --project=ours"

["project:test:google"]
description = "Level 2, audits: build, then run Google's Lighthouse audits (accessibility, best practices, SEO) locally (~40 s; CI runs this). Core Web Vitals are judged on a Cloudflare preview instead: project:test:cwv. Uses dist/, PREVIEW_PORT and the Chrome DevTools daemon: never alongside another local level or a remote level 2"
dir = "{{config_root}}"
depends = ["project:build"]
env = { TEST_TARGET = "local" }
# One level 2 at a time on this machine (flock on Linux, lockf on macOS): Lighthouse shares one
# Chrome DevTools daemon and needs a quiet CPU; a second run waits instead of skewing the first.
run = "$(command -v flock >/dev/null && echo flock || echo 'lockf -k') \"${TMPDIR:-/tmp}/remy-level2.lock\" ./node_modules/.bin/playwright test --project=google"

["project:verify"]
description = "Level 1: verify tasks, dependencies, MCP registration, types and our own checks (fast)"
dir = "{{config_root}}"
run = ["mise tasks validate", "npm ls --depth=0", { task = "mcp:verify" }, { task = "project:typecheck" }, { task = "project:test" }]
