# Default pipeline for a TanStack Start app on Cloudflare built on @joeblew999/remy-ui, driven by the
# including project's [env] inputs PREVIEW_PORT and DEPLOY_ORIGIN. Override a task by defining the
# same name in the project's own mise.toml.

["project:test:remote"]
description = "Both levels against TEST_BASE_URL, default DEPLOY_ORIGIN (~90 s). Touches no local build or port: run it in the background and keep coding"
dir = "{{config_root}}"
env = { TEST_TARGET = "remote", TEST_BASE_URL = "{{ get_env(name='TEST_BASE_URL', default=env.DEPLOY_ORIGIN) }}" }
run = ["mise run dev:allowed -- project:test:remote", "./node_modules/.bin/playwright test"]

["project:test:live"]
description = "The smoke checks against the live site (tests/smoke.spec.ts) at TEST_BASE_URL, default DEPLOY_ORIGIN (~5 s). cf:deploy runs it once the new version is live; use it instead of curl"
dir = "{{config_root}}"
env = { TEST_TARGET = "remote", TEST_BASE_URL = "{{ get_env(name='TEST_BASE_URL', default=env.DEPLOY_ORIGIN) }}" }
# By title, not by file: the shared checks are defined in the package's smoke.js, so a file filter
# (tests/smoke.spec.ts) selected none of them and only the app's own in-file tests ran.
run = "./node_modules/.bin/playwright test --project=ours --grep 'smoke [a-zA-Z-]+:'"

["project:report"]
description = "Open the HTML report from the last local project:test run"
dir = "{{config_root}}"
raw = true
run = "./node_modules/.bin/playwright show-report playwright-report/local"

["project:report:remote"]
description = "Open the HTML report from the last project:test:remote run"
dir = "{{config_root}}"
raw = true
run = "./node_modules/.bin/playwright show-report playwright-report/remote"

["project:setup"]
description = "Install dependencies, the shared skills, the AGENTS.md rules block, MCP registration and the flow's guard for agents, then verify (~1.5 min). GITHUB_TOKEN (read:packages, for the shared UI) comes from the shell or else from `gh auth token`"
dir = "{{config_root}}"
# Rendered only when the task runs; gh is asked only when the shell has no GITHUB_TOKEN.
# gh pinned here, so every app has the same one for `gh auth token` (a task's tools are active in its env).
tools = { "aqua:cli/cli" = "2.101.0" }
env = { GITHUB_TOKEN = "{% set token = get_env(name='GITHUB_TOKEN', default='') %}{% if token %}{{ token }}{% else %}{{ exec(command='gh auth token') }}{% endif %}" }
run = [{ task = "project:preconditions" }, "npm ci", { task = "skills:install" }, { task = "agents:rules" }, { task = "mcp:register" }, { task = "dev:guard" }, { task = "project:verify" }]

["project:test:consumers"]
description = "Hook for the other repositories this one serves, tested as they get it (GitHub runs it after every push, project:verify at a release); none by default. remy-auth runs template:test, its consumer fixture. Instant"
dir = "{{config_root}}"
run = "true"

["project:release-checks"]
description = "Hook for the checks a repository adds to its release (packages:release runs it after project:verify); none by default. Override it in the project's mise.toml (remy-auth runs ui:verify). Instant"
dir = "{{config_root}}"
run = "true"

["project:doctor"]
description = "Print the versions of the CLIs the shared tasks run, without contacting a Cloudflare account (~3 s); project:verify runs it"
dir = "{{config_root}}"
run = [
  "node --version",
  "npm --version",
  "./node_modules/.bin/wrangler --version",
  "./node_modules/.bin/chrome-devtools-mcp --version",
  "./node_modules/.bin/modern-web-guidance --version",
  "./node_modules/.bin/codex --version",
]

["project:generate"]
description = "Code an app generates before type checking: its own Paraglide catalog when it has one (project.inlang, into src/paraglide, the package's app-catalog options; ~1 s). Override it in the project's mise.toml (remy-auth runs ui:generate)"
dir = "{{config_root}}"
run = "[ ! -f project.inlang/settings.json ] || node node_modules/@joeblew999/remy-ui/src/app-catalog.js"

["project:typecheck"]
description = "Run project:generate, generate Worker types, check the app, then the shared tasks' own TypeScript (project:typecheck-tasks), ~3 s. The committed src/routeTree.gen.ts is regenerated by dev and build, with TanStack Start's plugin"
dir = "{{config_root}}"
run = [{ task = "project:generate" }, "./node_modules/.bin/wrangler types", "./node_modules/.bin/tsc", { task = "project:typecheck-tasks" }]

["project:prepare"]
description = "Hook for the local state an app needs before it runs (project:dev and project:build run it first); none by default. Override it in the project's mise.toml (remy-auth writes .dev.vars and migrates its local D1). Instant"
dir = "{{config_root}}"
run = "true"

["project:dev"]
description = "Run project:prepare, then the app with hot reload (port from vite.config.ts)"
dir = "{{config_root}}"
depends = ["project:prepare"]
raw = true
run = "./node_modules/.bin/vite dev"

["project:build"]
description = "Run project:prepare, then build the deployable artifact and dry-run the Cloudflare deployment"
dir = "{{config_root}}"
depends = ["project:prepare"]
run = ["./node_modules/.bin/vite build", "./node_modules/.bin/wrangler deploy --dry-run"]

["project:preview"]
description = "Build, then serve the production artifact on Cloudflare's local host at PREVIEW_PORT"
dir = "{{config_root}}"
depends = ["project:build"]
raw = true
run = "./node_modules/.bin/wrangler dev --ip 127.0.0.1 --port \"${PREVIEW_PORT:-4173}\""

["project:test"]
description = "Every browser check of ours in every language (~2 min with 13 languages): GitHub runs it after every push and project:verify at a release. Locally only to reproduce what failed there. Uses dist/ and PREVIEW_PORT: never two local levels at once"
dir = "{{config_root}}"
depends = ["project:build"]
env = { TEST_TARGET = "local" }
run = ["mise run dev:allowed -- project:test", "./node_modules/.bin/playwright test --project=ours"]

["project:check"]
description = "THE check while coding, in seconds: the plans list, types, and the checks that are plain functions (no build, no server, no browser), then translation status as a warning. Two parts run only when their inputs changed since they last passed: the route tree (a build, when a route file changed) and the docs Worker (when docs/ changed). Everything slower is on demand (project:test:only -- <words>) or runs on GitHub after a push; see docs/content/dev/how-we-work.md, test tiers"
dir = "{{config_root}}"
run = [{ task = "plans:check" }, { task = "project:single-copies" }, { task = "project:routes" }, { task = "project:typecheck" }, { task = "project:test:unit" }, { task = "i18n:check" }, { task = "project:check:docs" }]

["project:routes"]
description = "Regenerate src/routeTree.gen.ts when a route file or the parts list changed since the last time (TanStack Start's Vite plugin writes it during a build, ~5 s); otherwise nothing. project:check runs it before the types"
dir = "{{config_root}}"
sources = ["src/routes/**/*", "src/parts.json"]
outputs = { auto = true }
run = "./node_modules/.bin/vite build"

["project:check:docs"]
description = "The docs Worker's check (docs:check: build, types; ~30 s) when the app has docs and something in them changed since it last passed; otherwise nothing. project:check runs it last"
dir = "{{config_root}}"
sources = ["docs/content/**/*", "docs/*.ts", "docs/*.json", "packages/ui/src/docs/**/*.ts", "packages/ui/src/docs/**/*.tsx", "packages/ui/src/docs/**/*.js"]
outputs = { auto = true }
run = "[ ! -d docs ] || mise run docs:check"

["project:test:unit"]
description = "The checks that are plain functions (tests/**/*.unit.spec.ts): no build, no Worker, no browser (~2 s). project:check runs them every time; a rule that can be a function belongs here, not in the browser suite"
dir = "{{config_root}}"
env = { TEST_TARGET = "unit" }
run = "./node_modules/.bin/playwright test --project=unit --pass-with-no-tests"

["project:test:smoke"]
description = "Smoke, on purpose: build, then the smoke checks only (tests/smoke.spec.ts calls the package's smokeChecks): every page in en and ar answers with a heading, the pages named there hydrate without errors (~15 s)"
dir = "{{config_root}}"
depends = ["project:build"]
env = { TEST_TARGET = "local" }
# By title, not by file: the shared checks are defined in the package's smoke.js, so a file filter
# (tests/smoke.spec.ts) selected none of them and only the app's own in-file tests ran.
run = "./node_modules/.bin/playwright test --project=ours --grep 'smoke [a-zA-Z-]+:'"

["project:test:only"]
description = "One area: build, then only the checks whose title matches the words given, in QUICK_LOCALES (en, ar), e.g. mise run project:test:only -- formats. The one browser run the flow leaves to judgement, for an area that looks broken"
dir = "{{config_root}}"
depends = ["project:build"]
env = { TEST_TARGET = "local", CHECK_LOCALES = "{{ env.CHECK_LOCALES | default(value=env.QUICK_LOCALES | default(value='en,ar')) }}" }
run = "./node_modules/.bin/playwright test --project=ours --grep"

["project:test:quick"]
description = "On demand, before a risky merge: build, then every browser check of ours in QUICK_LOCALES (en and ar: left to right and right to left), ~45 s. Every language, the consumer fixture and Google's audits run on GitHub after a push, not here"
dir = "{{config_root}}"
depends = ["project:build"]
env = { TEST_TARGET = "local", CHECK_LOCALES = "{{ env.QUICK_LOCALES | default(value='en,ar') }}" }
run = ["mise run dev:allowed -- project:test:quick", "./node_modules/.bin/playwright test --project=ours"]

["project:test:google"]
description = "Level 2, audits: build, then run Google's Lighthouse audits (accessibility, best practices, SEO) locally (~40 s; CI runs this). Core Web Vitals are judged on a Cloudflare preview instead: project:test:cwv. Uses dist/, PREVIEW_PORT and the Chrome DevTools daemon: never alongside another local level or a remote level 2"
dir = "{{config_root}}"
depends = ["project:build"]
env = { TEST_TARGET = "local" }
# One level 2 at a time on this machine (flock on Linux, lockf on macOS): Lighthouse shares one
# Chrome DevTools daemon and needs a quiet CPU; a second run waits instead of skewing the first.
run = ["mise run dev:allowed -- project:test:google", "$(command -v flock >/dev/null && echo flock || echo 'lockf -k') \"${TMPDIR:-/tmp}/remy-level2.lock\" ./node_modules/.bin/playwright test --project=google"]

["project:verify"]
description = "RELEASES ONLY (packages:release runs it; GitHub runs its parts after every push): the tasks, dependencies, MCP registration, CLI versions and tooling invariants, types, the plain-function checks, every browser check in every language, then the other repositories this one serves (~4.5 min in remy-auth). Never while coding: project:check is the check"
dir = "{{config_root}}"
run = ["mise run dev:allowed -- project:verify", "mise tasks validate", "npm ls --depth=0", { task = "mcp:verify" }, "mise run dev:guard -- --check", { task = "project:doctor" }, { task = "project:verify-tooling" }, { task = "project:typecheck" }, { task = "project:test:unit" }, { task = "project:test" }, { task = "project:test:consumers" }]
