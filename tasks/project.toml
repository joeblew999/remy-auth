# Default pipeline for a TanStack Start app on Cloudflare built on @joeblew999/remy-ui, driven by the
# including project's [env] inputs PREVIEW_PORT and DEPLOY_ORIGIN. Override a task by defining the
# same name in the project's own mise.toml.

["project:test:remote"]
description = "Both levels against TEST_BASE_URL, default DEPLOY_ORIGIN (~90 s). Touches no local build or port: run it in the background and keep coding"
dir = "{{config_root}}"
env = { TEST_TARGET = "remote", TEST_BASE_URL = "{{ get_env(name='TEST_BASE_URL', default=env.DEPLOY_ORIGIN) }}" }
run = "./node_modules/.bin/playwright test"

["project:test:live"]
description = "Tier 1 against the live site: the smoke checks (tests/smoke.spec.ts) at TEST_BASE_URL, default DEPLOY_ORIGIN (~5 s). cf:deploy runs it once the new version is live; use it instead of curl"
dir = "{{config_root}}"
env = { TEST_TARGET = "remote", TEST_BASE_URL = "{{ get_env(name='TEST_BASE_URL', default=env.DEPLOY_ORIGIN) }}" }
# By title, not by file: the shared checks are defined in the package's smoke.js, so a file filter
# (tests/smoke.spec.ts) selected none of them and only the app's own in-file tests ran.
run = "./node_modules/.bin/playwright test --project=ours --grep 'smoke [a-zA-Z-]+:'"

["project:report"]
description = "Open the HTML report from the last local project:test run"
dir = "{{config_root}}"
raw = true
run = "./node_modules/.bin/playwright show-report playwright-report/local"

["project:report:remote"]
description = "Open the HTML report from the last project:test:remote run"
dir = "{{config_root}}"
raw = true
run = "./node_modules/.bin/playwright show-report playwright-report/remote"

["project:setup"]
description = "Install dependencies, the shared skills, the AGENTS.md rules block and MCP registration, then verify (~1.5 min). GITHUB_TOKEN (read:packages, for the shared UI) comes from the shell or else from `gh auth token`"
dir = "{{config_root}}"
# Rendered only when the task runs; gh is asked only when the shell has no GITHUB_TOKEN.
# gh pinned here, so every app has the same one for `gh auth token` (a task's tools are active in its env).
tools = { "aqua:cli/cli" = "2.101.0" }
env = { GITHUB_TOKEN = "{% set token = get_env(name='GITHUB_TOKEN', default='') %}{% if token %}{{ token }}{% else %}{{ exec(command='gh auth token') }}{% endif %}" }
run = [{ task = "project:preconditions" }, "npm ci", { task = "skills:install" }, { task = "agents:rules" }, { task = "mcp:register" }, { task = "project:verify" }]

["project:test:consumers"]
description = "Hook for the other repositories this one serves, tested as they get it (tier 3 and CI run it last); none by default. remy-auth runs template:test, its consumer fixture. Instant"
dir = "{{config_root}}"
run = "true"

["project:release-checks"]
description = "Hook for the checks a repository adds to its release (packages:release runs it after project:verify); none by default. Override it in the project's mise.toml (remy-auth runs ui:verify). Instant"
dir = "{{config_root}}"
run = "true"

["project:doctor"]
description = "Print the versions of the CLIs the shared tasks run, without contacting a Cloudflare account (~3 s); project:verify runs it"
dir = "{{config_root}}"
run = [
  "node --version",
  "npm --version",
  "./node_modules/.bin/wrangler --version",
  "./node_modules/.bin/chrome-devtools-mcp --version",
  "./node_modules/.bin/modern-web-guidance --version",
  "./node_modules/.bin/codex --version",
]

["project:generate"]
description = "Code an app generates before type checking: its own Paraglide catalog when it has one (project.inlang, into src/paraglide, the package's app-catalog options; ~1 s). Override it in the project's mise.toml (remy-auth runs ui:generate)"
dir = "{{config_root}}"
run = "[ ! -f project.inlang/settings.json ] || node node_modules/@joeblew999/remy-ui/src/app-catalog.js"

["project:typecheck"]
description = "Run project:generate, generate Worker types and check the app (~10 s; the committed src/routeTree.gen.ts is regenerated by dev and build, with TanStack Start's plugin)"
dir = "{{config_root}}"
run = [{ task = "project:generate" }, "./node_modules/.bin/wrangler types", "./node_modules/.bin/tsc"]

["project:dev"]
description = "Run the app with hot reload (port from vite.config.ts)"
dir = "{{config_root}}"
raw = true
run = "./node_modules/.bin/vite dev"

["project:build"]
description = "Build the deployable artifact and dry-run the Cloudflare deployment"
dir = "{{config_root}}"
run = ["./node_modules/.bin/vite build", "./node_modules/.bin/wrangler deploy --dry-run"]

["project:preview"]
description = "Build, then serve the production artifact on Cloudflare's local host at PREVIEW_PORT"
dir = "{{config_root}}"
depends = ["project:build"]
raw = true
run = "./node_modules/.bin/wrangler dev --ip 127.0.0.1 --port \"${PREVIEW_PORT:-4173}\""

["project:test"]
description = "Tier 4 with project:verify, releases: build, then every check of ours in every language ( ~75 s with 13 languages). Uses dist/ and PREVIEW_PORT: never two local levels at once"
dir = "{{config_root}}"
depends = ["project:build"]
env = { TEST_TARGET = "local" }
run = ["./node_modules/.bin/playwright test --project=ours", { task = "project:test:consumers" }]

["project:check"]
description = "Tier 0 while coding: plans:check, build and typecheck, no browser (~15 s), then i18n:check, and docs:check when the app has a docs Worker (docs/) (missing or stale translations are a warning here). Code freely; run a test tier when something looks wrong (docs/content/dev/how-we-work.md, test tiers)"
dir = "{{config_root}}"
# Build before typecheck: in a TanStack Start app the build is TanStack's route generator (Start's Vite
# plugin writes src/routeTree.gen.ts, with Start's Register types). TanStack's router CLI (tsr generate)
# writes the tree without that block, so the next build rewrites the file; tried and dropped 2026-09-26.
run = [{ task = "plans:check" }, { task = "project:single-copies" }, "./node_modules/.bin/vite build", { task = "project:typecheck" }, { task = "i18n:check" }, "[ ! -d docs ] || mise run docs:check"]

["project:test:smoke"]
description = "Tier 1, smoke: build, then the smoke checks only (tests/smoke.spec.ts calls the package's smokeChecks): every page in en and ar answers with a heading, the pages named there hydrate without errors (~15 s)"
dir = "{{config_root}}"
depends = ["project:build"]
env = { TEST_TARGET = "local" }
# By title, not by file: the shared checks are defined in the package's smoke.js, so a file filter
# (tests/smoke.spec.ts) selected none of them and only the app's own in-file tests ran.
run = "./node_modules/.bin/playwright test --project=ours --grep 'smoke [a-zA-Z-]+:'"

["project:test:only"]
description = "Tier 2, targeted: build, then only the checks whose title matches the words given, in QUICK_LOCALES (en, ar), e.g. mise run project:test:only -- formats. For an area that looks broken"
dir = "{{config_root}}"
depends = ["project:build"]
env = { TEST_TARGET = "local", CHECK_LOCALES = "{{ env.CHECK_LOCALES | default(value=env.QUICK_LOCALES | default(value='en,ar')) }}" }
run = "./node_modules/.bin/playwright test --project=ours --grep"

["project:test:quick"]
description = "Tier 3, quick: build, then every check of ours in QUICK_LOCALES only (default en and ar: left to right and right to left; languages not configured yet are skipped). Not a gate: project:verify, releases and CI run every language"
dir = "{{config_root}}"
depends = ["project:build"]
env = { TEST_TARGET = "local", CHECK_LOCALES = "{{ env.QUICK_LOCALES | default(value='en,ar') }}" }
run = ["./node_modules/.bin/playwright test --project=ours", { task = "project:test:consumers" }]

["project:test:google"]
description = "Level 2, audits: build, then run Google's Lighthouse audits (accessibility, best practices, SEO) locally (~40 s; CI runs this). Core Web Vitals are judged on a Cloudflare preview instead: project:test:cwv. Uses dist/, PREVIEW_PORT and the Chrome DevTools daemon: never alongside another local level or a remote level 2"
dir = "{{config_root}}"
depends = ["project:build"]
env = { TEST_TARGET = "local" }
# One level 2 at a time on this machine (flock on Linux, lockf on macOS): Lighthouse shares one
# Chrome DevTools daemon and needs a quiet CPU; a second run waits instead of skewing the first.
run = "$(command -v flock >/dev/null && echo flock || echo 'lockf -k') \"${TMPDIR:-/tmp}/remy-level2.lock\" ./node_modules/.bin/playwright test --project=google"

["project:verify"]
description = "Tier 4, releases: verify the tasks, dependencies, MCP registration, CLI versions and tooling invariants, types, then every check of ours in every language (~2 min)"
dir = "{{config_root}}"
run = ["mise tasks validate", "npm ls --depth=0", { task = "mcp:verify" }, { task = "project:doctor" }, { task = "project:verify-tooling" }, { task = "project:typecheck" }, { task = "project:test" }]
