# Project MCP registration and status; mcp:register is the file task in mcp/register.

["mcp:verify"]
description = "Verify project MCP registration matches this checkout and mise installation"
dir = "{{config_root}}"
# In TypeScript now (packages/ui/src/cli, remy mcp verify): forwards for whoever still types mise run, and goes with mise.
run = "if [ -f packages/ui/src/cli/remy.ts ]; then node packages/ui/src/cli/remy.ts mcp verify; else node ./node_modules/@joeblew999/remy-ui/cli/remy.js mcp verify; fi"

["mcp:status"]
description = "Show Chrome DevTools registration in both installed agent clients"
dir = "{{config_root}}"
# In TypeScript now (packages/ui/src/cli, remy mcp status): forwards for whoever still types mise run, and goes with mise.
run = "if [ -f packages/ui/src/cli/remy.ts ]; then node packages/ui/src/cli/remy.ts mcp status; else node ./node_modules/@joeblew999/remy-ui/cli/remy.js mcp status; fi"