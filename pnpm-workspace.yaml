# Vite is Vite Plus's core, everywhere.
# One copy of each package that breaks when installed twice (remy-ui's remy.singleCopy), at the catalog's version,
# whatever a dependency asks for.
overrides:
  mdast-util-to-markdown: 'catalog:'
  '@tanstack/query-core': 'catalog:'
  '@tanstack/react-query': 'catalog:'
  '@tanstack/react-start': 'catalog:'
  '@tanstack/react-router': 'catalog:'
  react-dom: 'catalog:'
  react: 'catalog:'
  vite@*: 'catalog:'
  # One Vitest, the one vp test runs (vp toolchain vitest); vp migrate moves it with vite-plus.
  vitest@*: '5.0.5'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
# The only packages whose install scripts run (pnpm runs none it is not told to): esbuild's and workerd's binaries.
allowBuilds:
  esbuild: true
  workerd: true

# Vite Plus manages Node and pnpm (its devEngines and .node-version); pnpm neither switches its own version nor
# installs runtimes (guide/env.md).
runtimeOnFail: ignore
pmOnFail: ignore
