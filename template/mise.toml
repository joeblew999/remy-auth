# A Remy app (https://remy-auth-docs.gedw99.workers.dev/dev/tasks#a-new-consumer). The tasks rely on
# mise 2026.9.12; an include cannot set it, so every app states it.
min_version = "2026.9.12"

[tools]
node = "26.10.0"

[settings]
task.timings = true

# Every task is remy-auth's, at the tag that matches @joeblew999/remy-ui in package.json;
# mise run project:upgrade-ui -- <version> moves both (and the CI workflow's tag).
[task_config]
includes = ["git::https://github.com/joeblew999/remy-auth.git//tasks?ref=v0.14.0"]

[env]
# A worktree or agent picks its own port from the shell: PREVIEW_PORT=4232 mise run project:test:quick.
PREVIEW_PORT = "{{ get_env(name='PREVIEW_PORT', default='4173') }}"
DEPLOY_ORIGIN = "https://my-app.example.workers.dev"
# The docs Worker (docs/): its origin, the app's links to it (Vite reads VITE_*), its content for the i18n tasks.
DOCS_ORIGIN = "https://my-app-docs.example.workers.dev"
VITE_DOCS_ORIGIN = "https://my-app-docs.example.workers.dev"
I18N_DOCS_DIR = "docs/content"
DOCS_PREVIEW_PORT = "{{ get_env(name='DOCS_PREVIEW_PORT', default='4174') }}"
