# The heavy checks (every language, Google's audits, the repositories this one serves) on every push to
# main, in parallel, on GitHub: remy-auth's shared workflow, at the tag of the tasks and package
# (project:upgrade-ui moves it). Locally the check is project:check, in seconds. Its release job runs only for tags, which an app that publishes no packages never makes.
name: Checks

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  checks:
    uses: joeblew999/remy-auth/.github/workflows/google.yml@v0.14.0
    permissions:
      contents: write
      packages: write
