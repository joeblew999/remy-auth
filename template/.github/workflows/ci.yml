# The heavy checks (every language, Google's audits, the repositories this one serves) on every push to
# main, in parallel, on GitHub: remy-auth's shared workflow, at the tag of the tasks and package
# (npm run upgrade moves it). Locally the check is npm run dev:change, in seconds. Its release job runs only for tags, which an app that publishes no packages never makes.
# The shared workflow is called ci.yml from the release after 0.15.1 (google.yml before); a release and
# `remy upgrade` write the right name with the tag.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  checks:
    uses: joeblew999/remy-auth/.github/workflows/google.yml@v0.15.1
    permissions:
      contents: write
      packages: write
