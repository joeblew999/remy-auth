# This app's workspace (pnpm, as `vp create` makes one): the app here and its docs, and every version once, in the
# catalog, which each package.json names as "catalog:". remy upgrade moves the platform's two; the rest are the
# platform's own versions, and its overrides keep one copy of each that breaks when installed twice.
packages:
  - docs

catalog:
  '@inlang/paraglide-js': '2.25.4'
  mdast-util-to-markdown: '2.1.2'
  '@tanstack/query-core': '5.103.2'
  '@tanstack/react-query': '5.103.2'
  '@joeblew999/remy-cli': '0.16.0'
  '@joeblew999/remy-ui': '0.16.0'
  '@playwright/test': '1.63.0'
  '@tanstack/react-devtools': '0.10.13'
  '@tanstack/react-query-devtools': '5.103.2'
  '@tanstack/react-router': '1.170.39'
  '@tanstack/react-router-devtools': '1.167.2'
  '@tanstack/react-start': '1.168.58'
  '@types/node': '26.6.2'
  '@types/react': '19.3.0'
  '@types/react-dom': '19.3.0'
  fumadocs-mdx: '15.4.5'
  react: '19.3.1'
  skills: '1.7.0'
  '@vitest/coverage-v8': '5.0.5'
  react-dom: '19.3.1'
  vite-plus: '1.3.0'
  wrangler: '4.137.0'

# Vite is Vite Plus's core, everywhere.
# One copy of each package that breaks when installed twice, at the catalog's version,
# whatever a dependency asks for.
overrides:
  mdast-util-to-markdown: 'catalog:'
  '@tanstack/query-core': 'catalog:'
  '@tanstack/react-query': 'catalog:'
  '@tanstack/react-start': 'catalog:'
  '@tanstack/react-router': 'catalog:'
  react-dom: 'catalog:'
  react: 'catalog:'
  vite@*: 'npm:@voidzero-dev/vite-plus-core@1.3.0'
  # One Vitest, the one vp test runs (vp toolchain vitest); vp migrate moves it with vite-plus.
  vitest@*: '5.0.5'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

# The only packages whose install scripts run: esbuild's and workerd's binaries.
allowBuilds:
  esbuild: true
  workerd: true

# Vite Plus manages Node and pnpm (its devEngines and .node-version); pnpm neither switches its own version nor
# installs runtimes (guide/env.md).
runtimeOnFail: ignore
pmOnFail: ignore
