# The checks on GitHub, in parallel: remy-auth's shared workflow, at the tag of the tasks and package (vp run upgrade
# moves it), the same as vp run ci here. Its release job runs only for tags, which an app never makes.
# The shared workflow is called ci.yml from the release after 0.15.1 (google.yml before); a release and
# `remy upgrade` write the right name with the tag.
name: CI

# Not on a push to main: the push's own hook ran `vp run ci` first. A pull request (Dependabot's), or by hand.
on:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  checks:
    uses: joeblew999/remy-auth/.github/workflows/ci.yml@v0.17.0
    permissions:
      contents: write
      packages: write
