[tools]
node = "26.10.0"

# Shared tasks live in tasks/, one file per namespace, so other projects can include the same
# directory by git reference; see tasks/README.md.
# Every task prints its duration and the entry point prints the total, so slow steps show.
[settings]
task.timings = true

[task_config]
includes = ["tasks"]

[env]
# Inputs the shared pipeline tasks read; this project overrides only project:typecheck and
# project:verify below, because it owns the shared package.
PREVIEW_PORT = "4173"
DEPLOY_ORIGIN = "https://remy-auth.gedw99.workers.dev"


[tasks."auth:cli"]
description = "Run the pinned Better Auth CLI (pass --help for commands)"
raw_args = true
dir = "{{config_root}}"
run = "./node_modules/.bin/auth"

[tasks."packages:check"]
description = "Preview latest npm package versions without changing files"
dir = "{{config_root}}"
run = "./node_modules/.bin/ncu --target latest --dep prod,dev,optional --workspaces --reject @joeblew999/remy-ui --removeRange"

[tasks."packages:upgrade"]
description = "Upgrade npm packages beyond existing pins, including majors, then verify tooling"
dir = "{{config_root}}"
run = [
  "./node_modules/.bin/ncu --target latest --dep prod,dev,optional --workspaces --reject @joeblew999/remy-ui --removeRange --upgrade",
  "npm install --prefer-online --strict-peer-deps",
  { task = "project:verify" },
]

[tasks."project:verify"]
description = "Verify tooling, GUI types, Worker build and browser tests (overrides the shared default)"
dir = "{{config_root}}"
run = [
  "mise tasks validate",
  "npm ls --depth=0",
  "./node_modules/.bin/codex --version",
  { task = "mcp:verify" },
  { task = "project:doctor" },
  "node scripts/verify-tooling.mjs",
  { task = "project:typecheck" },
  { task = "project:test" },
]

[tasks."auth:info"]
description = "Show Better Auth setup diagnostics"
raw_args = true
dir = "{{config_root}}"
run = "./node_modules/.bin/auth info"

[tasks."project:doctor"]
description = "Check installed CLI versions without contacting a Cloudflare account"
dir = "{{config_root}}"
run = [
  "node --version",
  "npm --version",
  "./node_modules/.bin/auth --version",
  "./node_modules/.bin/wrangler --version",
  "./node_modules/.bin/chrome-devtools-mcp --version",
  "./node_modules/.bin/modern-web-guidance --version",
]

[tasks."project:typecheck"]
description = "Compile the shared catalogs, then generate Worker types and check the GUI, shared package and Worker (overrides the shared default)"
dir = "{{config_root}}"
run = [
  { task = "ui:generate" },
  "./node_modules/.bin/wrangler types",
  "./node_modules/.bin/tsc",
]

[tasks."ui:pack"]
description = "Compile and pack the shared UI for another Vite/Tailwind consumer"
dir = "{{config_root}}"
run = [
  { task = "ui:generate" },
  "npm pack --workspace @joeblew999/remy-ui",
]

[tasks."ui:components"]
description = "Regenerate every shadcn component from the registry into the shared package (run from the app, shadcn's monorepo layout; the only way those files change)"
dir = "{{config_root}}"
run = "./node_modules/.bin/shadcn add button card input label badge alert field separator direction skeleton empty --overwrite --yes"

[tasks."ui:theme"]
description = "Rewrite the shared stylesheet with shadcn's default theme (Nova style, neutral) through shadcn apply; never edit packages/ui/src/styles/globals.css by hand"
dir = "{{config_root}}"
run = "./node_modules/.bin/shadcn apply nova --only theme --yes"

[tasks."ui:verify"]
description = "Prove the shadcn files are exactly what the shadcn CLI writes: re-run ui:theme and ui:components, then fail on any difference (~15 s, needs the network)"
dir = "{{config_root}}"
run = [
  { task = "ui:theme" },
  { task = "ui:components" },
  "git diff --exit-code -- packages/ui/src/components packages/ui/src/styles src/lib",
]

[tasks."ui:release"]
description = "Run level 1 locally (~30 s in all), then publish the shared UI to GitHub Packages, tag, push and create the GitHub release; CI runs level 2 on the tag"
dir = "{{config_root}}"
depends = ["project:verify", "ui:verify"]
run = "bash scripts/release.sh"

[tasks."ui:generate"]
description = "Compile the shared locale catalogs"
dir = "{{config_root}}"
run = "node packages/ui/paraglide.mjs"

