# The tasks rely on mise 2026.9.12: task run lists, env templating and include overrides.
min_version = "2026.9.12"

[tools]
node = "26.10.0"
# Secrets from the macOS keychain (fnox.toml), as in every joeblew999 repo.
fnox = "1.35.3"

# Shared tasks live in tasks/, one file per namespace, so other projects can include the same
# directory by git reference; see tasks/README.md.
# Every task prints its duration and the entry point prints the total, so slow steps show.
[settings]
task.timings = true

[task_config]
includes = ["tasks"]

[env]
# Inputs the shared pipeline tasks read; this project overrides only project:generate and
# project:verify below, because it owns the shared package.
# A worktree or agent picks its own port from the shell: PREVIEW_PORT=4231 mise run project:verify.
PREVIEW_PORT = "{{ get_env(name='PREVIEW_PORT', default='4173') }}"
DEPLOY_ORIGIN = "https://remy-auth.gedw99.workers.dev"


[tasks."auth:cli"]
description = "Run the pinned Better Auth CLI (pass --help for commands)"
raw_args = true
dir = "{{config_root}}"
run = "./node_modules/.bin/auth"

[tasks."packages:check"]
description = "Preview latest npm package versions without changing files"
dir = "{{config_root}}"
run = "./node_modules/.bin/ncu --target latest --dep prod,dev,optional --workspaces --reject @joeblew999/remy-ui,@joeblew999/remy-auth-contract --removeRange"

[tasks."packages:upgrade"]
description = "Upgrade npm packages beyond existing pins, including majors, then verify tooling"
dir = "{{config_root}}"
run = [
  "./node_modules/.bin/ncu --target latest --dep prod,dev,optional --workspaces --reject @joeblew999/remy-ui,@joeblew999/remy-auth-contract --removeRange --upgrade",
  "npm install --prefer-online --strict-peer-deps",
  { task = "project:verify" },
]

[tasks."project:verify"]
description = "Verify tooling, GUI types, Worker build and browser tests (overrides the shared default)"
dir = "{{config_root}}"
run = [
  "mise tasks validate",
  "npm ls --depth=0",
  "./node_modules/.bin/codex --version",
  { task = "mcp:verify" },
  { task = "project:doctor" },
  "node scripts/verify-tooling.mjs",
  { task = "project:typecheck" },
  { task = "project:test" },
]

[tasks."project:preview"]
description = "Build, then serve the production artifact on Cloudflare's local host at PREVIEW_PORT, remote bindings off (overrides the shared default: the AI Search binding needs a login and costs model calls; /docs/ask then shows its \"no answer\" path)"
dir = "{{config_root}}"
depends = ["project:build"]
raw = true
run = "./node_modules/.bin/wrangler dev --local --ip 127.0.0.1 --port \"${PREVIEW_PORT:-4173}\""

[tasks."auth:info"]
description = "Show Better Auth setup diagnostics"
raw_args = true
dir = "{{config_root}}"
run = "./node_modules/.bin/auth info"

[tasks."project:doctor"]
description = "Check installed CLI versions without contacting a Cloudflare account"
dir = "{{config_root}}"
run = [
  "node --version",
  "npm --version",
  "./node_modules/.bin/auth --version",
  "./node_modules/.bin/wrangler --version",
  "./node_modules/.bin/chrome-devtools-mcp --version",
  "./node_modules/.bin/modern-web-guidance --version",
]

[tasks."project:generate"]
description = "Compile the shared catalogs and write Fumadocs MDX's docs entry files (.source/) before type checking (overrides the shared hook, which project:typecheck runs first)"
dir = "{{config_root}}"
run = [{ task = "ui:generate" }, "./node_modules/.bin/fumadocs-mdx"]

[tasks."ui:pack"]
description = "Compile and pack the shared UI for another Vite/Tailwind consumer"
dir = "{{config_root}}"
run = [
  { task = "ui:generate" },
  "npm pack --workspace @joeblew999/remy-ui",
]

[tasks."ui:components"]
description = "Regenerate every shadcn component from the registry into the shared package (run from the app, shadcn's monorepo layout; the only way those files change)"
dir = "{{config_root}}"
run = "./node_modules/.bin/shadcn add button card input label badge alert field separator direction skeleton empty sidebar breadcrumb collapsible dropdown-menu avatar sheet tooltip navigation-menu use-mobile table spinner --overwrite --yes"

[tasks."ui:blocks"]
description = "Show what upstream shadcn changed in each owned block, in place (shadcn add --diff from the package, whose components alias puts blocks in packages/ui/src/blocks/<name>/components); merge by hand, never --overwrite (it drops Remy's data)"
dir = "{{config_root}}"
run = [
  "./node_modules/.bin/shadcn add @shadcn/sidebar-16 -c packages/ui --diff src/blocks/sidebar-16/components/app-sidebar.tsx",
  "./node_modules/.bin/shadcn add @shadcn/sidebar-16 -c packages/ui --diff src/blocks/sidebar-16/components/nav-main.tsx",
  "./node_modules/.bin/shadcn add @shadcn/sidebar-16 -c packages/ui --diff src/blocks/sidebar-16/components/site-header.tsx",
]

[tasks."ui:theme"]
description = "Rewrite the shared stylesheet with shadcn's default theme (Nova style, neutral) through shadcn apply; never edit packages/ui/src/styles/globals.css by hand"
dir = "{{config_root}}"
run = "./node_modules/.bin/shadcn apply nova --only theme --yes"

[tasks."ui:verify"]
description = "Prove the shadcn files are exactly what the shadcn CLI writes: re-run ui:theme and ui:components, then fail on any difference (~15 s, needs the network)"
dir = "{{config_root}}"
run = [
  { task = "ui:theme" },
  { task = "ui:components" },
  "git diff --exit-code -- packages/ui/src/components packages/ui/src/styles src/lib",
]

[tasks."ui:release"]
description = "Run level 1, ui:verify, level 2's audits locally and its Core Web Vitals on a Cloudflare preview (alias release), one after another (~5 min; uses dist/ and PREVIEW_PORT, so nothing else local at the same time), then publish the shared UI to GitHub Packages, tag, push and create the GitHub release; CI repeats level 2 on the tag"
dir = "{{config_root}}"
# A run list, not depends: mise runs depends in parallel, and ui:verify rewrites files while
# project:verify builds.
run = [
  { task = "project:verify" },
  { task = "ui:verify" },
  { task = "project:test:google" },
  { task = "project:test:cwv", args = ["release"] },
  "bash scripts/release.sh",
]

[tasks."ui:generate"]
description = "Compile the shared locale catalogs"
dir = "{{config_root}}"
run = "node packages/ui/paraglide.mjs"


[tasks."docs:dev"]
description = "LOCAL app, REMOTE answers: run the app with hot reload on this machine, its answers from the production index remy-docs-pages (each question is a model call) (CLOUDFLARE_ENV=docs). Ask at /en/docs/ask; docs pages at /en/docs. Needs Cloudflare login"
dir = "{{config_root}}"
raw = true
env = { CLOUDFLARE_ENV = "docs" }
run = "./node_modules/.bin/vite dev"

# Route B (.plans/docs-ai-sync.md): the docs as files in the R2 bucket remy-docs, one per page; AI
# Search's R2 source syncs from it (new, changed and deleted files).
[tasks."docs:publish"]
description = "REMOTE, PRODUCTION: make the R2 bucket remy-docs hold exactly the docs pages (put each, delete any other file), then start an AI Search sync. Seconds"
dir = "{{config_root}}"
run = "node scripts/docs-publish.mjs"

[tasks."docs:translations"]
description = "LOCAL: every translation in docs/i18n/ keeps its English file's headings (same number and levels), so an English edit cannot leave it behind unseen. Instant; project:check runs it"
dir = "{{config_root}}"
run = "node scripts/docs-translations.mjs"

[tasks."docs:questions"]
description = "REMOTE, search only (no answers, next to no cost): each fixed question (src/docs/questions.json) must find its docs page in the top three. Instance: remy-docs-pages (default)"
dir = "{{config_root}}"
run = "node scripts/docs-questions.mjs"

# The emergency stop for answers: a Worker secret the answer code checks before any model call.
# Takes effect in seconds (Wrangler deploys the secret as a new version, no build); the docs pages stay up.
[tasks."docs:answers:off"]
description = "REMOTE, PRODUCTION: stop all AI answers now (secret ASK_PAUSED; /docs/ask shows \"no answer\" and the docs). Seconds, no build"
dir = "{{config_root}}"
run = "printf 1 | ./node_modules/.bin/wrangler secret put ASK_PAUSED"

[tasks."docs:answers:on"]
description = "REMOTE, PRODUCTION: turn AI answers back on (delete the secret ASK_PAUSED; Wrangler asks you to confirm)"
dir = "{{config_root}}"
raw = true
run = "./node_modules/.bin/wrangler secret delete ASK_PAUSED"

[tasks."docs:answers:status"]
description = "REMOTE, read only: say whether AI answers are on or stopped in production"
dir = "{{config_root}}"
run = "./node_modules/.bin/wrangler secret list --format json | grep -q '\"ASK_PAUSED\"' && echo 'Answers: STOPPED (mise run docs:answers:on to resume)' || echo 'Answers: on'"

