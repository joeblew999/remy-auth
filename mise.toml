# The tasks rely on mise 2026.9.12: task run lists, env templating and include overrides.
min_version = "2026.9.12"

[tools]
node = "26.10.0"
# Secrets from the macOS keychain (fnox.toml), as in every joeblew999 repo.
fnox = "1.35.3"

# Shared tasks live in tasks/, one file per namespace, so other projects can include the same
# directory by git reference; see docs/content/dev/tasks.md.
# Every task prints its duration and the entry point prints the total, so slow steps show.
[settings]
task.timings = true

[task_config]
includes = ["tasks"]

[env]
# Inputs the shared pipeline tasks read; this project overrides only project:generate and
# project:release-checks below, because it owns the shared package.
# A worktree or agent picks its own port from the shell: PREVIEW_PORT=4231 mise run project:verify.
PREVIEW_PORT = "{{ get_env(name='PREVIEW_PORT', default='4173') }}"
DEPLOY_ORIGIN = "https://remy-auth.gedw99.workers.dev"
# The staging environment's origin (cf:staging; env.staging in wrangler.jsonc): its own Worker and databases.
STAGING_ORIGIN = "https://remy-auth-staging.gedw99.workers.dev"
# The two again for the page (Vite reads VITE_*): the Settings page lists what each deployment is running.
VITE_DEPLOY_ORIGIN = "https://remy-auth.gedw99.workers.dev"
VITE_STAGING_ORIGIN = "https://remy-auth-staging.gedw99.workers.dev"
# The docs Worker (docs/): its public origin, the app's "Docs" link to it (Vite reads VITE_*), and the
# shared i18n tasks' docs folder (Fumadocs' layout, one folder per site).
DOCS_ORIGIN = "https://remy-auth-docs.gedw99.workers.dev"
VITE_DOCS_ORIGIN = "https://remy-auth-docs.gedw99.workers.dev"
I18N_DOCS_DIR = "docs/content"
# The shared catalogs' inlang project for the i18n:messages:* tasks (template/ holds a new app's own).
I18N_INLANG = "packages/ui/project.inlang"
DOCS_PREVIEW_PORT = "{{ get_env(name='DOCS_PREVIEW_PORT', default='4174') }}"
# The packages:* tasks: the package whose version names a release (tag vX.Y.Z), and the release's title.
RELEASE_PACKAGE = "@joeblew999/remy-ui"
RELEASE_TITLE = "Shared UI"

[tasks."auth:cli"]
description = "Run the pinned Better Auth CLI (pass --help for commands)"
raw_args = true
dir = "{{config_root}}"
# A package.json script now (npm run auth): forwards for whoever still types mise run, and goes with mise.
run = 'npm run --silent auth -- "$@"'

[tasks."auth:info"]
description = "Show Better Auth setup diagnostics"
raw_args = true
dir = "{{config_root}}"
# A package.json script now (npm run auth:info): forwards for whoever still types mise run, and goes with mise.
run = 'npm run --silent auth:info -- "$@"'

[tasks."auth:generate"]
description = "LOCAL: write what Better Auth's options need beyond migrations/ as the next numbered D1 migration (the pinned auth CLI's generate through src/auth/cli.ts, into a file made by wrangler d1 migrations create). Nothing is written when the schema is already there. ~5 s"
usage = 'arg "<name>" help="A name for the migration, e.g. organization"'
dir = "{{config_root}}"
# A package.json script now (npm run auth:generate): forwards for whoever still types mise run, and goes with mise.
run = 'npm run --silent auth:generate -- "${usage_name}"'

[tasks."auth:migrate"]
description = "LOCAL: apply migrations/ (identities) and migrations-demo/ (the showcase's notes) to Wrangler's local D1 databases (wrangler d1 migrations apply --local; only what is not applied yet, ~3 s). project:prepare runs it, so dev, preview and every check start on the current schema. The deployed databases are migrated on the owner's request only"
dir = "{{config_root}}"
# A package.json script now (npm run auth:migrate): forwards for whoever still types mise run, and goes with mise.
run = "npm run --silent auth:migrate"

[tasks."auth:local"]
description = "LOCAL: write .dev.vars (ignored by git) when it is missing: ENVIRONMENT=local and a random BETTER_AUTH_SECRET. Never overwrites one that exists. Instant; project:prepare runs it"
dir = "{{config_root}}"
# A package.json script now (npm run local): forwards for whoever still types mise run, and goes with mise.
run = "npm run --silent local"

[tasks."auth:mail"]
description = "LOCAL: the newest sign-in codes the local environment captured for an address instead of mailing them: mise run auth:mail -- you@example.com. Asks the running local Worker's /dev/mail (project:dev on 5173; --origin for a preview), because a second process reading the local D1 while the Worker runs fails. Instant"
usage = '''
arg "<email>" help="The address the codes were sent to"
flag "--origin <origin>" default="http://127.0.0.1:5173" help="The running local Worker"
'''
dir = "{{config_root}}"
# A package.json script now (npm run auth:mail): forwards for whoever still types mise run, and goes with mise.
run = 'npm run --silent auth:mail -- "${usage_email}" --origin "${usage_origin}"'

[tasks."auth:provision"]
description = "Prints what a deployment (production, and staging beside it) needs on Cloudflare and creates nothing (that is the owner's): the identity database and the showcase's, each with its id in wrangler.jsonc and its migrations, the secret, and the domain the sign-in code is mailed from. Until then cf:deploy refuses to deploy, because Wrangler would create the database by itself. Instant"
dir = "{{config_root}}"
# A package.json script now (npm run auth:provision): forwards for whoever still types mise run, and goes with mise.
run = "npm run --silent auth:provision"

[tasks."ui:guard-fixture"]
description = "LOCAL: install oRPC 1.15.4 for the guard's two-major check into tests/guard/v1 alone, from its own lockfile, when it is missing (the app's oRPC stays one copy). ~3 s the first time, needs the network; project:prepare runs it"
dir = "{{config_root}}"
# A package.json script now (npm run local): forwards for whoever still types mise run, and goes with mise.
run = "npm run --silent local"

[tasks."project:prepare"]
description = "remy-auth's local state before it runs (overrides the shared hook that project:dev and project:build run first): .dev.vars (auth:local), the local D1's migrations (auth:migrate), and the guard fixture's oRPC 1 (ui:guard-fixture). ~2 s"
dir = "{{config_root}}"
run = "npm run --silent local"

[tasks."project:generate"]
description = "Compile the shared catalogs before type checking (overrides the shared hook, which project:typecheck runs first: this project owns the package)"
dir = "{{config_root}}"
# A package.json script now (npm run generate): forwards for whoever still types mise run, and goes with mise.
run = "npm run --silent generate"

[tasks."docs:cli"]
description = "The pinned Fumadocs CLI in the shared docs Worker (packages/ui/src/docs; feature docs|search|llms|mcp|og|..., export; pass --help); what it writes is a change to the package to review. remy-auth only: apps take the Worker from the package"
raw_args = true
dir = "{{config_root}}"
# A package.json script now (npm run docs:cli): forwards for whoever still types mise run, and goes with mise.
run = 'npm run --silent docs:cli -- "$@"'

[tasks."ui:components"]
description = "Regenerate every shadcn component from the registry into the shared package (run from the app, shadcn's monorepo layout; the only way those files change)"
dir = "{{config_root}}"
# A package.json script now (npm run ui:components): forwards for whoever still types mise run, and goes with mise.
run = "npm run --silent ui:components"

[tasks."ui:blocks"]
description = "Show what upstream shadcn changed in each owned block, in place (shadcn add --diff from the package, whose components alias puts blocks in packages/ui/src/blocks/<name>/components); merge by hand, never --overwrite (it drops Remy's data)"
dir = "{{config_root}}"
# A package.json script now (npm run ui:blocks): forwards for whoever still types mise run, and goes with mise.
run = "npm run --silent ui:blocks"

[tasks."ui:theme"]
description = "Rewrite the shared stylesheet with shadcn's default theme (Nova style, neutral) through shadcn apply; never edit packages/ui/src/styles/globals.css by hand"
dir = "{{config_root}}"
# A package.json script now (npm run ui:theme): forwards for whoever still types mise run, and goes with mise.
run = "npm run --silent ui:theme"

[tasks."ui:verify"]
description = "Prove the shadcn files are exactly what the shadcn CLI writes: re-run ui:theme and ui:components, then fail on any difference (~15 s, needs the network)"
dir = "{{config_root}}"
# A package.json script now (npm run ui:verify): forwards for whoever still types mise run, and goes with mise.
run = "npm run --silent ui:verify"

[tasks."ui:release"]
description = "Release the shared UI and the tasks together (alias release): the flow's dev:release, from a clean main, which runs the shared packages:release (every gate, then tag vX.Y.Z of @joeblew999/remy-ui, publish the package and the contract when new, create the GitHub release; ~5 min, nothing else local at the same time). Before it, in one commit: the versions and CHANGELOG.md's section"
alias = "release"
dir = "{{config_root}}"
run = [{ task = "dev:release" }]

[tasks."project:release-checks"]
description = "remy-auth's own release checks (overrides the shared hook, which packages:release runs after project:verify): the blank app pins this release (template:check), the shadcn files are exactly what the CLI writes (ui:verify)"
dir = "{{config_root}}"
# A package.json script now (npm run release-checks): forwards for whoever still types mise run, and goes with mise.
run = "npm run --silent release-checks"

[tasks."template:check"]
description = "The blank app (template/, where a new repo starts) pins the version being released: @joeblew999/remy-ui in package.json, the tasks ref in mise.toml, the shared workflow's tag. Instant"
dir = "{{config_root}}"
# A package.json script now (npm run template:check): forwards for whoever still types mise run, and goes with mise.
run = "npm run --silent template:check"

[tasks."ui:version"]
description = "Set the next release's version everywhere it is written: @joeblew999/remy-ui's package.json, the showcase's and the contract's floor for it, and the blank app's three pins (its package, tasks ref and workflow tag); template:check proves them equal at release. Instant; commit with CHANGELOG.md's section"
usage = 'arg "<version>" help="The next version without the v, e.g. 0.14.1"'
dir = "{{config_root}}"
# A package.json script now (npm run ui:version): forwards for whoever still types mise run, and goes with mise.
run = 'npm run --silent ui:version -- "${usage_version}"'

[tasks."template:test"]
description = "The consumer fixture (fixtures/consumer): the blank app and a package it owns, set up as another repository gets the platform (the package from a tarball with a version of its own, the tasks outside any node_modules, the template's .npmrc), then install, skills, tooling, tier 3, docs and a dry-run publish (~1.5 to 3 min, needs the network; ports PREVIEW_PORT and DOCS_PREVIEW_PORT + 100). GitHub runs it after every push; locally inside the flow and releases run it (project:test:consumers)"
dir = "{{config_root}}"
run = "node packages/ui/src/cli/remy.ts test consumers"

[tasks."project:test:consumers"]
description = "remy-auth's consumer checks (overrides the shared hook GitHub runs after every push and project:verify at a release): template:test"
dir = "{{config_root}}"
run = "node packages/ui/src/cli/remy.ts test consumers"

[tasks."ui:generate"]
description = "Compile the shared locale catalogs, generate the remy agent skill from the developer docs, and emit the command line (packages/ui/cli, the bin an app runs; remy-auth runs the source). Skipped when the sources are older than the output"
dir = "{{config_root}}"
# A package.json script now (npm run generate): forwards for whoever still types mise run, and goes with mise.
run = "npm run --silent generate"

