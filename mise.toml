# The repository's tools on a machine that has only mise (every Claude session does):
# `mise install` (Node, pnpm and the dependencies), then `vp run <name>` as everywhere else.
# mise reads the versions where they already are: Node from .node-version, pnpm from
# package.json's devEngines. vp, wrangler and playwright are the repository's own, from the
# lockfile; mise puts them on PATH. Not mise's `vp` tool: that is a second copy of the
# toolchain, whose `vp pack` builds with its own tools and cannot find the repository's.
[settings]
idiomatic_version_file_enable_tools = ["node", "pnpm"]

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[hooks]
postinstall = "pnpm install --frozen-lockfile"
