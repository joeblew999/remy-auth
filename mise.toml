# The tasks rely on mise 2026.9.12: task run lists, env templating and include overrides.
min_version = "2026.9.12"

[tools]
node = "26.10.0"
# Secrets from the macOS keychain (fnox.toml), as in every joeblew999 repo.
fnox = "1.35.3"

# Shared tasks live in tasks/, one file per namespace, so other projects can include the same
# directory by git reference; see docs/content/dev/tasks.md.
# Every task prints its duration and the entry point prints the total, so slow steps show.
[settings]
task.timings = true

[task_config]
includes = ["tasks"]

[env]
# Inputs the shared pipeline tasks read; this project overrides only project:generate and
# project:release-checks below, because it owns the shared package.
# A worktree or agent picks its own port from the shell: PREVIEW_PORT=4231 mise run project:verify.
PREVIEW_PORT = "{{ get_env(name='PREVIEW_PORT', default='4173') }}"
DEPLOY_ORIGIN = "https://remy-auth.gedw99.workers.dev"
# The docs Worker (docs/): its public origin, the app's "Docs" link to it (Vite reads VITE_*), and the
# shared i18n tasks' docs folder (Fumadocs' layout, one folder per site).
DOCS_ORIGIN = "https://remy-auth-docs.gedw99.workers.dev"
VITE_DOCS_ORIGIN = "https://remy-auth-docs.gedw99.workers.dev"
I18N_DOCS_DIR = "docs/content"
# The shared catalogs' inlang project for the i18n:messages:* tasks (template/ holds a new app's own).
I18N_INLANG = "packages/ui/project.inlang"
DOCS_PREVIEW_PORT = "{{ get_env(name='DOCS_PREVIEW_PORT', default='4174') }}"
# The packages:* tasks: the package whose version names a release (tag vX.Y.Z), and the release's title.
RELEASE_PACKAGE = "@joeblew999/remy-ui"
RELEASE_TITLE = "Shared UI"

[tasks."auth:cli"]
description = "Run the pinned Better Auth CLI (pass --help for commands)"
raw_args = true
dir = "{{config_root}}"
run = "./node_modules/.bin/auth"

[tasks."auth:info"]
description = "Show Better Auth setup diagnostics"
raw_args = true
dir = "{{config_root}}"
run = "./node_modules/.bin/auth info"

[tasks."auth:generate"]
description = "LOCAL: write what Better Auth's options need beyond migrations/ as the next numbered D1 migration (the pinned auth CLI's generate through src/auth/cli.ts, into a file made by wrangler d1 migrations create). Nothing is written when the schema is already there. ~5 s"
usage = 'arg "<name>" help="A name for the migration, e.g. organization"'
dir = "{{config_root}}"
run = '''
set -eu
sql=$(mktemp -d)/schema.sql
./node_modules/.bin/auth generate --config src/auth/cli.ts --output "$sql" --yes
[ -s "$sql" ] || { echo "auth:generate: migrations/ already holds the schema; nothing written."; exit 0; }
./node_modules/.bin/wrangler d1 migrations create DB "${usage_name}" > /dev/null
file=$(ls migrations/*_"${usage_name}".sql | tail -1)
mv "$sql" "$file"
echo "auth:generate: wrote $file; apply it with mise run auth:migrate."
'''

[tasks."auth:migrate"]
description = "LOCAL: apply migrations/ to Wrangler's local D1 (wrangler d1 migrations apply --local; only what is not applied yet, ~2 s). project:prepare runs it, so dev, preview and every test tier start on the current schema. The deployed database is migrated on the owner's request only"
dir = "{{config_root}}"
run = "./node_modules/.bin/wrangler d1 migrations apply DB --local"

[tasks."auth:local"]
description = "LOCAL: write .dev.vars (ignored by git) when it is missing: ENVIRONMENT=local and a random BETTER_AUTH_SECRET. Never overwrites one that exists. Instant; project:prepare runs it"
dir = "{{config_root}}"
run = '''
[ -f .dev.vars ] && exit 0
printf 'ENVIRONMENT=local\nBETTER_AUTH_SECRET=%s\n' "$(openssl rand -base64 32)" > .dev.vars
echo "auth:local: wrote .dev.vars (local environment, a new local secret)."
'''

[tasks."auth:mail"]
description = "LOCAL: the newest sign-in codes the local environment captured for an address instead of mailing them: mise run auth:mail -- you@example.com. Asks the running local Worker's /dev/mail (project:dev on 5173; --origin for a preview), because a second process reading the local D1 while the Worker runs fails. Instant"
usage = '''
arg "<email>" help="The address the codes were sent to"
flag "--origin <origin>" default="http://127.0.0.1:5173" help="The running local Worker"
'''
dir = "{{config_root}}"
run = 'curl --fail --silent --show-error --get --data-urlencode "recipient=${usage_email}" "${usage_origin}/dev/mail"'

[tasks."auth:provision"]
description = "Prints what the deployed sign-in needs on Cloudflare and creates nothing (that is the owner's): the D1 database and its id in wrangler.jsonc, the migrations, the secret. Until then cf:deploy refuses to deploy, because Wrangler would create the database by itself. Instant"
dir = "{{config_root}}"
run = '''
cat <<'STEPS'
The deployed sign-in needs three things, in this order (each changes the Cloudflare account):

  1. The database:      ./node_modules/.bin/wrangler d1 create remy-auth
     then put the printed database_id in wrangler.jsonc, in d1_databases beside "binding": "DB".
  2. Its tables:        ./node_modules/.bin/wrangler d1 migrations apply DB --remote
  3. The signing secret: openssl rand -base64 32 | ./node_modules/.bin/wrangler secret put BETTER_AUTH_SECRET

Sign-in itself stays off on the deployment until mail delivery exists (.plans/auth-service.md):
the account page keeps its empty state there.
STEPS
'''

[tasks."ui:guard-fixture"]
description = "LOCAL: install oRPC 1.15.4 for the guard's two-major check into tests/guard/v1 alone, from its own lockfile, when it is missing (the app's oRPC stays one copy). ~3 s the first time, needs the network; project:prepare runs it"
dir = "{{config_root}}"
run = "[ -d tests/guard/v1/node_modules ] || npm ci --prefix tests/guard/v1 --no-audit --no-fund --loglevel=error"

[tasks."project:prepare"]
description = "remy-auth's local state before it runs (overrides the shared hook that project:dev and project:build run first): .dev.vars (auth:local), the local D1's migrations (auth:migrate), and the guard fixture's oRPC 1 (ui:guard-fixture). ~2 s"
dir = "{{config_root}}"
run = [{ task = "auth:local" }, { task = "auth:migrate" }, { task = "ui:guard-fixture" }]

[tasks."project:generate"]
description = "Compile the shared catalogs before type checking (overrides the shared hook, which project:typecheck runs first: this project owns the package)"
dir = "{{config_root}}"
run = [{ task = "ui:generate" }]

[tasks."docs:cli"]
description = "The pinned Fumadocs CLI in the shared docs Worker (packages/ui/src/docs; feature docs|search|llms|mcp|og|..., export; pass --help); what it writes is a change to the package to review. remy-auth only: apps take the Worker from the package"
raw_args = true
dir = "{{config_root}}/packages/ui/src/docs"
run = "node ../../../../node_modules/@fumadocs/cli/dist/index.js"

[tasks."ui:components"]
description = "Regenerate every shadcn component from the registry into the shared package (run from the app, shadcn's monorepo layout; the only way those files change)"
dir = "{{config_root}}"
run = "./node_modules/.bin/shadcn add button card input label badge alert field separator direction skeleton empty sidebar breadcrumb collapsible dropdown-menu avatar sheet tooltip navigation-menu use-mobile table spinner tabs --overwrite --yes"

[tasks."ui:blocks"]
description = "Show what upstream shadcn changed in each owned block, in place (shadcn add --diff from the package, whose components alias puts blocks in packages/ui/src/blocks/<name>/components); merge by hand, never --overwrite (it drops Remy's data)"
dir = "{{config_root}}"
run = [
  "./node_modules/.bin/shadcn add @shadcn/sidebar-16 -c packages/ui --diff src/blocks/sidebar-16/components/app-sidebar.tsx",
  "./node_modules/.bin/shadcn add @shadcn/sidebar-16 -c packages/ui --diff src/blocks/sidebar-16/components/nav-main.tsx",
  "./node_modules/.bin/shadcn add @shadcn/sidebar-16 -c packages/ui --diff src/blocks/sidebar-16/components/site-header.tsx",
]

[tasks."ui:theme"]
description = "Rewrite the shared stylesheet with shadcn's default theme (Nova style, neutral) through shadcn apply; never edit packages/ui/src/styles/globals.css by hand"
dir = "{{config_root}}"
run = "./node_modules/.bin/shadcn apply nova --only theme --yes"

[tasks."ui:verify"]
description = "Prove the shadcn files are exactly what the shadcn CLI writes: re-run ui:theme and ui:components, then fail on any difference (~15 s, needs the network)"
dir = "{{config_root}}"
run = [
  { task = "ui:theme" },
  { task = "ui:components" },
  "git diff --exit-code -- packages/ui/src/components packages/ui/src/styles src/lib",
]

[tasks."ui:release"]
description = "Release the shared UI and the tasks together (alias release): the shared packages:release (every gate, then tag vX.Y.Z of @joeblew999/remy-ui, publish the package and the contract when new, create the GitHub release; ~5 min, nothing else local at the same time). Before it, in one commit: the versions and CHANGELOG.md's section"
alias = "release"
dir = "{{config_root}}"
run = [{ task = "packages:release" }]

[tasks."project:release-checks"]
description = "remy-auth's own release checks (overrides the shared hook, which packages:release runs after project:verify): the blank app pins this release (template:check), the shadcn files are exactly what the CLI writes (ui:verify)"
dir = "{{config_root}}"
run = [{ task = "template:check" }, { task = "ui:verify" }]

[tasks."template:check"]
description = "The blank app (template/, where a new repo starts) pins the version being released: @joeblew999/remy-ui in package.json, the tasks ref in mise.toml, the shared workflow's tag. Instant"
dir = "{{config_root}}"
run = '''
v=$(node -p "require('./packages/ui/package.json').version")
grep -q "tasks?ref=v$v\"" template/mise.toml && grep -q "\"@joeblew999/remy-ui\": \"$v\"" template/package.json && grep -q "google.yml@v$v$" template/.github/workflows/google.yml || { echo "template/ must pin $v: @joeblew999/remy-ui in package.json, ref=v$v in mise.toml, google.yml@v$v in .github/workflows/google.yml" >&2; exit 1; }
echo "template/ pins $v."
'''

[tasks."ui:version"]
description = "Set the next release's version everywhere it is written: @joeblew999/remy-ui's package.json, the showcase's and the contract's floor for it, and the blank app's three pins (its package, tasks ref and workflow tag); template:check proves them equal at release. Instant; commit with CHANGELOG.md's section"
dir = "{{config_root}}"
usage = 'arg "<version>" help="The next version without the v, e.g. 0.14.1"'
run = '''
set -eu
v="${usage_version}"
echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "ui:version: $v is not a version like 0.14.1" >&2; exit 1; }
npm pkg set version="$v" --workspace @joeblew999/remy-ui > /dev/null
# The showcase and the contract are written against this release's platform exports.
npm pkg set "peerDependencies.@joeblew999/remy-ui=>=$v" --workspace @joeblew999/remy-showcase > /dev/null
npm pkg set "peerDependencies.@joeblew999/remy-ui=>=$v" --workspace @joeblew999/remy-auth-contract > /dev/null
npm install --package-lock-only --no-audit --no-fund --loglevel=error
(cd template && npm pkg set "dependencies.@joeblew999/remy-ui=$v")
sed -i.bak -E "s#(tasks\?ref=v)[0-9]+\.[0-9]+\.[0-9]+#\1$v#" template/mise.toml
sed -i.bak -E "s#(google\.yml@v)[0-9]+\.[0-9]+\.[0-9]+#\1$v#" template/.github/workflows/google.yml
rm -f template/mise.toml.bak template/.github/workflows/google.yml.bak
mise run template:check
'''

[tasks."template:test"]
description = "The consumer fixture (fixtures/consumer): the blank app and a package it owns, set up as another repository gets the platform (the package from a tarball with a version of its own, the tasks outside any node_modules, the template's .npmrc), then install, skills, tooling, tier 3, docs and a dry-run publish (~1.5 to 3 min, needs the network; ports PREVIEW_PORT and DOCS_PREVIEW_PORT + 100). Tier 3, CI and releases run it (project:test:consumers)"
dir = "{{config_root}}"
run = "bash fixtures/consumer/run.sh"

[tasks."project:test:consumers"]
description = "remy-auth's consumer checks (overrides the shared hook that tier 3 and CI run last): template:test"
dir = "{{config_root}}"
run = [{ task = "template:test" }]

[tasks."ui:generate"]
description = "Compile the shared locale catalogs and generate the remy agent skill from the developer docs (skipped when their sources are older than the output)"
dir = "{{config_root}}"
sources = ["packages/ui/messages/*.json", "packages/ui/project.inlang/settings.json", "packages/ui/paraglide.mjs", "packages/ui/skill.mjs", "packages/ui/package.json", "docs/content/dev/*.md", "docs/content/dev/*.mdx"]
outputs = ["packages/ui/src/paraglide/**/*", "packages/ui/skills/remy/**/*"]
run = ["node packages/ui/paraglide.mjs", "node packages/ui/skill.mjs"]

