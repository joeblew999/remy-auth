[tools]
node = "26.10.0"

# Shared tasks live in tasks/, one file per namespace, so other projects can include the same
# directory by git reference; see tasks/README.md.
[task_config]
includes = ["tasks"]

[env]
# Inputs the shared pipeline tasks read; this project overrides only project:typecheck and
# project:verify below, because it owns the shared package.
PREVIEW_PORT = "4173"
DEPLOY_ORIGIN = "https://remy-auth.gedw99.workers.dev"


[tasks."auth:cli"]
description = "Run the pinned Better Auth CLI (pass --help for commands)"
raw_args = true
dir = "{{config_root}}"
run = "./node_modules/.bin/auth"

[tasks."packages:check"]
description = "Preview latest npm package versions without changing files"
dir = "{{config_root}}"
run = "./node_modules/.bin/ncu --target latest --dep prod,dev,optional --workspaces --reject @joeblew999/remy-ui --removeRange"

[tasks."packages:upgrade"]
description = "Upgrade npm packages beyond existing pins, including majors, then verify tooling"
dir = "{{config_root}}"
run = [
  "./node_modules/.bin/ncu --target latest --dep prod,dev,optional --workspaces --reject @joeblew999/remy-ui --removeRange --upgrade",
  "npm install --prefer-online --strict-peer-deps",
  { task = "project:verify" },
]

[tasks."project:verify"]
description = "Verify tooling, GUI types, Worker build and browser tests (overrides the shared default)"
dir = "{{config_root}}"
run = [
  "mise tasks validate",
  "npm ls --depth=0",
  "./node_modules/.bin/codex --version",
  { task = "mcp:verify" },
  { task = "project:doctor" },
  "node scripts/verify-tooling.mjs",
  { task = "project:typecheck" },
  { task = "project:test" },
]

[tasks."auth:info"]
description = "Show Better Auth setup diagnostics"
raw_args = true
dir = "{{config_root}}"
run = "./node_modules/.bin/auth info"

[tasks."project:doctor"]
description = "Check installed CLI versions without contacting a Cloudflare account"
dir = "{{config_root}}"
run = [
  "node --version",
  "npm --version",
  "./node_modules/.bin/auth --version",
  "./node_modules/.bin/wrangler --version",
  "./node_modules/.bin/chrome-devtools-mcp --version",
  "./node_modules/.bin/modern-web-guidance --version",
]

[tasks."project:typecheck"]
description = "Compile the shared catalogs, then generate types and check the GUI, shared package and Worker (overrides the shared default)"
dir = "{{config_root}}"
run = [
  { task = "ui:generate" },
  "./node_modules/.bin/wrangler types",
  "./node_modules/.bin/react-router typegen",
  "./node_modules/.bin/tsc",
]

[tasks."ui:pack"]
description = "Compile and pack the shared UI for another Vite/Tailwind consumer"
dir = "{{config_root}}"
run = [
  { task = "ui:generate" },
  "npm pack --workspace @joeblew999/remy-ui",
]

[tasks."ui:components"]
description = "Regenerate every shadcn component in the shared package from the registry (the only way those files change)"
dir = "{{config_root}}"
run = "./node_modules/.bin/shadcn add button card input label badge alert field separator -c packages/ui --overwrite --yes"

[tasks."ui:release"]
description = "Run every check locally, then publish the shared UI to GitHub Packages, tag, push and create the GitHub release"
dir = "{{config_root}}"
depends = ["project:verify"]
shell = "bash -euo pipefail"
run = '''
version=$(node -p "require('./packages/ui/package.json').version")
[ "$(git branch --show-current)" = main ] || { echo "Release from main."; exit 1; }
[ -z "$(git status --porcelain)" ] || { echo "Commit everything before releasing."; exit 1; }
git fetch --tags -q
if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then echo "v$version is already tagged; bump packages/ui/package.json."; exit 1; fi
tmp=$(mktemp -d)
printf '//npm.pkg.github.com/:_authToken=%s\n' "$(gh auth token)" > "$tmp/npmrc"
NPM_CONFIG_USERCONFIG="$tmp/npmrc" npm publish --workspace @joeblew999/remy-ui --ignore-scripts
git tag -a "v$version" -m "Shared UI $version"
git push origin main
git push origin "v$version"
awk -v v="$version" 'index($0, "## [" v "]") == 1 {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > "$tmp/notes.md"
gh release create "v$version" --title "Shared UI $version" --notes-file "$tmp/notes.md"
rm -rf "$tmp"
echo "Published @joeblew999/remy-ui@$version and released v$version."
'''

[tasks."ui:generate"]
description = "Compile the shared locale catalogs"
dir = "{{config_root}}"
run = "node packages/ui/paraglide.mjs"

